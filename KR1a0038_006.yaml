body:
  text: 周易玩辭卷六宋項安世述大畜乾下艮上大畜小畜小畜初爻皆不受畜至終而畜道始成所以為小畜也大畜初爻皆受其畜至終而畜道反通所以為大畜也彖剛健乾也篤實艮也輝光艮乾互離也剛健以主之篤實以充之輝光以發之所畜愈富其德愈新此所謂大畜也此言畜之本體也九以剛在上五自下尚之乾以健在內艮自上止之外能尚賢以畜人才內能止健以畜天德所畜若此可謂大正矣此所謂利貞也此言畜之致用也畜人畜物皆不為大畜財畜兵皆不為正畜之大正者不過畜賢畜德二事而已能畜人才則不私其祿矣自三至上為頤能養賢以及萬民故曰不家食吉養賢也辭義在於養人或謂不食於家則反為受養非其義也能畜天德則不陷於險矣六四六五為艮之腓趾皆與乾應有涉險之具故曰利涉大川應乎天也尚賢而能養則非以虛文尚之故賢者可得而畜也止健而心與之應則非勉強以止之故天德可得而畜也畜有止聚二義物止則聚不止不聚也故畜兼二義焉大象前言往行則聖賢在上以象艮也畜德則聖賢在下以象乾也文在外故為小畜識在心故為大畜前言往行如山皆至善之所止也識而畜之如天其所成就豈有窮邪識漢書作志義同六爻大畜六爻以上下耦觀初九為六四所畜者也初性純剛故戒之以有厲利止不可犯災四能制之於初故為童牛之牿九二為六五所畜者也二性剛則得中故能自脫其輹而無過尤五據利勢以制之故為豶豕之牙牿者闌角之木牙者繫豕之杙也九三與上九相合而不相畜者也九三健極而進故為良馬逐言逐者明下二陽皆隨之也上九在上而導乾以上行故為天之衢亨言亨明畜道之變也九三前有二隂尚當艱貞而防衛既越二隂而至於上九則乾道通行無復疑阻矣輿衛以説卦考之坤為大輿為衆則輿衛疑若坤象也而諸卦多於乾言輿小畜之三曰輿説輹大有之二曰大車以載大畜之二曰輿説輹三曰輿衛大壯之四曰壯于大輿之輹凡皆乾爻何哉蓋車之全體惟乾足以當之輿者車中之箱坤止象其箱足以容物而已故坤為大與而乾為大車大有之九二是也至於輿傍之輻其直指象乾輿下之輹其壯亦象乾輻以利輪之轉輹以利軸之轉皆主為圓非坤象也輿之有衛亦不訓為衆古書之稱衛者皆武衛也按考工記周人之輿有六等之備戈也人也殳也戟也矛也並軫為六蓋輿衛之強如此非乾何以當之此爻輿衛蓋總指三陽皆同載而上進者也然必皆冠以輿字者坤隂為主故也小畜大畜大壯皆隂在上而畜陽者也大有柔得尊位大中而九二自下應之故雖專言車亦有積載之象童牛豶豕良馬初九在初故稱童牛乾之初爻自坤變也九二以剛居柔無勢故為豶豕乾之中爻屬坎豕也九三純乾故為良馬馬以健行為良九三健之極也告牙告説文云牛角橫木也正引易童牛之告為證牙埤雅云以杙繫豕也胡翼之易傳正用其説今按告以制牛則牙以制豕從可知矣二説冝用但告字從牛者别是一字説文云牛馬牢也周書牿牛馬是也則此告不當從牛有喜有慶喜慶皆隂陽相得之辭卦中惟二隂有應故四為有喜而五為有慶喜者據已言之慶則其喜及人五居君位故及人也若論止物之道則制之於初乃為大善故四為元吉五獨得吉而已大畜時也無妄災也凡隂皆受制於陽今以乾陽之尊而受畜於四五之二隂四為大臣五為人君故不得不聽其畜也如大畜者乃可以言時矣凡人之禍多因自取無妄之時無自取之道如無妄者乃可以言災矣曰字何字九三互兊為口曰者三語下也何者三問上也三方與羣陽自相告語防警輿衛以虞二隂之見止忽得上九合志之人容其上往故驚喜而問之也艮在上卦本為門闕為小徑以止物者忽為衢道以通天陽之上行何其大也怪其與本質相反是以何之頤震下艮上頤大過小過中孚上經將終受以頤大過下經將終受以中孚小過四卦皆不反對所以明雷風山澤之正用也四卦之象皆肖坎離蓋雷風山澤之氣出於坎離而坎離之氣出於乾坤此兩儀所以生四象四象所以生八卦也頥小過頤上止下動其象為頤小過上動下止其象為杵臼惟此二象最為易曉彖頤之彖曰觀頤自求口實若非夫子贊辭明白則後儒必不分作養人養已兩條也賁之彖曰賁亨小利有攸往亦因贊辭方知亨是下卦小利有攸往是上卦也後人決不敢如此解之便如此解人必不服也由是推之今人欲以一説穿一卦者可不謂率然乎易之彖自取成卦之主與兩卦之體及中爻為義大象自取卦象為法爻辭自據逐爻論事其取義極有相逺處此章觀其所養指上九言之觀其自養指初九言之初上二陽即上下兩卦之主爻也天地養萬物萬物始乎震成乎艮天地養物之功終始於二卦之內四時八卦之用皆包於頤故卦氣始於中孚而終於頤此頤之時所以為大也山下有雷頤雷在地中復靜中有動也雷出地奮豫動而出乎靜也天下雷行物與無妄雷之用也雷在天上大壯雷之體也雷風恆陽上隂下各居其所也風雷益隂上陽下互致其功也雲雷屯水氣方上將雨之候也雷雨作解水氣下矣既雨之時也電雷噬嗑電耀乎外雷震乎內將擊之雷也雷電皆至豐雷出電外擊物之雷也山下有雷頤聲未出山也山上有雷小過聲已出山也澤上有雷歸妹陽感隂而出也澤中有雷隨隂翕陽而入也言語飲食節飲食象山之止物謹言語象雷之藏聲初九頤以正為吉初九得正而凶者初九為動之主動則失正故也頤卦惟有二陽上九在上謂之由頤固為所養之主初九在下亦足為自養之賢靈龜伏息而在下初九之象也朵頤在上而下垂上九之象也上九為卦之主故稱我羣隂從我而求養固其所也初九本無所求乃亦仰而觀我有靈而不自保有貴而不自珍宜其凶也初九本靈本貴聖人以其為動之主居養之初故深戒之以明自養之道象言亦不足貴者示其本貴也頤卦肖離離為龜龜陽物而下伏故初九一爻得靈龜之本象上九以主爻稱我説見觀卦顚頤拂經于丘六二顚頤拂經于丘頤説者多不同當以四五參之四與二俱顚頤五與二俱拂經其説不容有異也頤之義以養正為吉二四皆正有可養之道反隂虛而無實不能以自養如人有食而自傾之故皆為顚頤大過本末皆柔而顚其室鼎初以柔顚其趾則顚為傾覆之義明矣然顚去已惡而受上之陽亦有致吉之理如鼎之顚趾是也故在六四一爻不害其為吉也居尊位大中而養天下人道之常經也二五得位得中有可養之勢而不能自養反由養於不中無位之爻與常經相悖故皆為拂經六三小象以悖道解拂拂之訓悖明矣然拂經而合於道亦君子之時中如豫之由於九四是也故在六五一爻不害其為吉也二四俱顚獨四得吉者四去上近二去上逺故不受其施也二五俱拂五獨得吉者五性好止二性好動不能貞於從上也雖與四隂聚而就養或捨其類動而去之則有拂貞之凶矣故曰六二征凶行失類也經者常法猶可拂也貞者正道不可拂也易中丘皆為聚渙以二隂相聚為有丘頤四隂皆聚於上上又艮體故為于丘二動則成咸腓故為征凶六三拂頤貞三字當連讀頤之卦辭曰頤貞吉三之爻辭曰拂頤貞凶卦中惟此一爻與卦義相反故曰道大悖也三與上隔純坤坤為十故曰十年勿用頤之六爻皆由上而養者也四五徒以與上同體猶能致吉三為正應而反凶者不正而好動也五亦不正然性好止故能居貞而吉頤之不可不貞如此六四六四既吉矣又言無咎者以所養言之上來養已其施光大故為吉以自養言之性靜而專意念深逺故為無咎二四皆受上之施者也二動而征故凶四止而不動故無咎明自養之不可不謹也逐逐其欲逐逐説文作跾跾式六反逺也詳耽耽之義則跾為宜耽耽深也跾跾逺也皆有沈厚専一之義艮寅為虎四靜而正故其象如此六五上九六五上九二爻皆當以小象解之六五之居貞非自守也貞於從上也故曰居貞之吉順以從上也成王不疑周公孝昭委任霍光頤六五之貞也六五違上而自守則不能以養物矣上九之厲吉非能自吉也得六五之委任而吉也故曰由頤厲吉大有慶也隂陽相得為慶上九苟不得君而自用則厲且凶矣易中柔爻之貞皆訓從恆六五之貞婦用之為從一夫用之為從婦直以從為訓也六爻鄭剛中氏曰頤卦上三爻皆吉喜其止也下三爻皆凶惡其動也涉大川六五柔弱待人而養非濟難之才上九養人故能濟大難成王昭帝非濟難之君能濟難者周公霍光也頤肖離而反坎故上九利於涉川大過肖坎故上六過涉而凶也卦氣過蹇則為頤亦有涉川之象大過巽下兊上過字過者越而過之所謂過猶不及者是也故巨弼訓為相過王肅音為戈蓋古義如此若訓為過誤之過則失其讀矣觀小過爻辭弗過過祖皆是相過越之意雖過乎哀過乎莽過乎儉亦是越而過之非過誤也彖凡卦之彖辭兼備衆義不必穿為一説也如大過二字自是泛言萬事大者過也凡大者皆是非一端也棟橈二字則以六爻之象言之中四爻強初上二爻皆弱有棟橈之象此則禍變之大者也利有攸往亨五字則以六爻之才言之中四爻剛雖大過而得時措之中初上二爻又能巽而説不失人心故利於有行雖遇大變而可以亨此則才略之大者也巽而説之下加行字者就大過言之也過字在序卦訓為動為行能以巽説而行於大難之中是以利有攸往也利有攸往乃亨先言亨後言利有攸往者亨自亨利自利也今先言利有攸往後言亨者明亨因於往也故彖曰利有攸往乃亨言往乃亨不往則不亨也棟既橈矣不往則壓焉何亨之有澤滅木大過兊上巽下固為澤滅木之正象然以六爻言之四陽在二隂之中亦有澤滅木之象焉故九二九五皆為枯楊九三九四皆為棟初六為藉於地而上六為滅其頂其象明矣二五皆濵於澤故稱楊焉楊澤木也當大過之時故稱枯焉過則木枯也二亦濵於澤者卦象兩兊反對也凡不反對之卦八皆就卦內自相反對乾坤坎離頤大過中孚小過是也衍象大過自大壯變而成卦大壯為上棟下宇故其變為棟橈繫辭又以大過為棺椁生則棟宇死則棺椁亦相變為義也人藏於棺椁棺椁藏於土亦有澤滅木之象焉獨立不懼遁世無悶獨立不懼木之植也遁世無悶澤之説也江東鄭夬曰獨立不懼居大位任大事者也遁世無悶有大德無大位者也白茅初六一爻則彖所謂本弱者也當滅木之時畏禍而過於謹者也本弱象茅巽象白巽在地爻象藉凡祀神之物皆以白茅藉之於地故取義焉九二九三全卦有棟橈之象而九三乃獨有之全卦有利往之象而九二乃獨有之何哉蓋九二當剛過之時獨能居柔而用中又與柔比在六爻之中獨此一爻不為過甚之事故無不利也卦體本以中太強而本末弱是以為橈九三以剛居剛又處巽之極為躁在六爻之中獨此一爻為過於強故棟愈橈而不可輔也九二九五二五皆無正應而過以與隂者也二所與者初初本也故為稊稊者木根新生之茅也初又巽之主爻為木為長為髙木已過而復芽又長且髙故有往亨之理五所與者上上末也故為華上又兊之主爻為剛鹵為毁折為附決皆非木之所冝木已過而生華又毁且決故無久生之理也九三九四九三有應在上而象以為無輔九四有應在下而象以為不橈乎下何哉凡卦皆上下相應惟大過之時不用常理獨以所比為親初與二比而為老夫女妻五與上比而為老婦士夫皆過以相與則三與四亦當相與乃合大過之義今二爻皆剛無相與之情故三謂之無輔輔以比言則指四明矣四謂之不橈乎下橈者三也則指三明矣棟橈棟隆大過四陽二在下為根五在上為枝三四兩爻在本身為棟就兩棟言之三過於強故橈四不過故隆四若從三則與之俱橈故三為不可輔而四以有它為吝言不可從三也九三庾亮之急也九四王導之寬也無咎無譽大過九五與坤六四同占者其操術同也坤六四之至謹大過九五之中立在已皆可無咎然括囊無補於當世老婦不能以生育安足譽乎象言可醜正解無譽二字明居上位而中立者不可自以無咎為能也以此坊民猶有以長樂老自譽者過涉滅頂凶無咎上六一爻則彖所謂末弱者也力不足以濟難而志存大義故過於勇如陳蕃李膺之事此亦大過人之行雖至於滅頂而不可咎也老夫士夫二髙於初故二為老而初為女上髙於五故上為老而五為士各就所比之爻自為老少兒大過之取象皆然習坎坎下坎上習字重卦之序坎在六子之先故於坎卦加習字以起後例示離震艮兊巽皆當以重習起義不與初經三畫之卦同義也故離為繼明震為洊恐艮為各不相與巽為申命兊為相習義皆與初卦不同乾最為首不於乾加習字乾坤六畫只是一爻自二以上便皆為習習義在爻不在重卦至六子而後重與單異故孔子於乾坤但以天行地勢為言而於六子始有洊兩兼麗隨習之文也坎字坎彖自為兩節其象為水之多其義為險之重自水流而不盈至往有功以水言也自天險不可升至大矣哉以險言也卦辭專取水為義爻辭皆以險為義不盈水流而不盈謂不止也坎不盈謂不滿也不止故有孚不滿故中未大因其辭而釋之義自辨也凡物盈則止水盈則愈行故坎有時而盈水無時而盈也往有功也姚小彭氏曰坎勞卦也凡坎用事則曰往有功需蹇解漸皆是安世按漸雖無坎而二三四有坎進者自初至五歷坎而後得位故曰進得位往有功也天下之事孰不以勞而成以逸而敗哉常德行習教事德行常修則邪念不能入其中教事洊習則衰俗不能亂其守此君子設險以治身也教事謂禮樂詩書之教初二五初六習坎入坎者已在重坎之下而又加以不正更入于窞故曰失道凶也九二之坎有險即初六之習坎言坎之上又有坎也二者剛中之才雖賢於初六能不入坎然無應於上不能自拔猶在坎中故曰未出中也九五已登上坎無重坎矣然水必盈坎而後可出九五獨處隂中而無應於下如水之力適與坎平較之九二稍能自見而已然未能流而出坎故曰中未大也大扺出險之道以有應為功使九二上有六五之應則可以承天寵而懷萬邦矣使九五下有六二之應則可以建萬國而親諸侯矣又何險之足患哉初六上六初六兩爻凶同而情異初六在重坎之下陷于險者也其失道也昏愚之所致也上六居重坎之上為險者也其失道也故為之也當險之初則陷于險者受其凶及險之極則為險者凶必及之矣既係用徽纆又置於叢棘亦重險之義也他爻之險皆遇險而陷于其中上六之重險則人設之以治罪人者故曰係曰置皆執治之辭也二五九二九五在全卦之中為有孚為心亨為行有尚者兩剛相繼出於險中不可得而掩遏有不失其信而志於必亨之義以此而往宜其有功也若在各爻言之止為各能自守不陷於坎中而已皆無出險之功故二為求小得五為祇既平而已五居大位故以未大譏之其實二爻皆未能出中者也二以柔自居五安其位雖有剛中之才皆無出險之志獨六二不安其位有志於尚往而才不足以立功此坎之六爻所以皆不能盡成卦之義也六三坎卦尚往利剛而不利柔剛能往柔不能往也獨六四一爻進而承剛得免於咎初六上六皆以失道致凶六三亦隂柔之人止言勿用止言無功而不言失道凶者初六入險最深上六處險之極皆無出險之道坐受其凶者也六三志剛而不安於位來之坎坎甚矣其有志於出險也惜其天質隂柔不足以往故戒之以勿用諭之以無功示與往有功者異爾若論其志正坎道之所尚也其何失之有來之坎坎之者往也坎坎者勞貌也詩之坎坎伐檀是也先儒以其有兩坎字便稱來往皆險非也此止言上下往來之勞下文始言險之多爾欲進而上則險而不可升欲居其位則枕而不能安欲退而下則又入於坎中之窞才不剛位不正時不利皆無所施此所以戒之以勿用也象曰終無功者言雖勞其心力多方圖之終無出險之效也味終字可見坎坎之為勞矣六四爻句新安朱先生曰朝説之氏言古讀作樽酒簋一句二用缶一句古文小象亦無二字安世按簋缶牖咎於古韻為協且陸德明釋文及李鼎祚所集先儒解皆與此合則朝説尤信樽酒用缶自牖姚小彭氏曰冠之醴子與問名之醴賔舅姑之醴婦三者皆用特尊甒而醴子與賔皆不在牖醴婦與教成之祭皆席于牖間而教成之祭復不用尊與甒是故用尊甒而在牖者惟醴婦為然此所以象剛柔之際也酒止於特尊故稱樽酒體以瓦甒盛之故稱用缶於象坎為酒為缶諸卦有坎者皆為酒爾雅小罍謂之坎罍即缶也剛柔際也解之初六與九四相交則各當其位故曰剛柔之際義無咎也坎之六四與九五相交則成解之九四故亦曰剛柔際也六四上六六四以禮為險上六以刑為險六四順道而承剛者也故以禮為險以防其苟合尊以盛酒簋以盛食缶以盛醴席於户牖之間以納其結約之好昔之聖人所以制為醴婦之儀若是其艱阻者所以重剛柔之交而慮夫婦之終也易而合者終必有敝不如是不足以永終而無咎也上六失道而乘剛者也故以刑為險以防其犯上係以徽纆使不得動置之叢棘使不得安下罪者一年而舍中罪二年而舍上罪三年而舍昔之聖人所以制為圜土之法若是其峻極者所以困犯上之人而使之知君長之可畏也三歲者上三爻之終也起居動作皆不自得至於三歲之久其凶如此誰敢復犯乎九五為君當以道為險者也惜其道不大故無可言者六爻下卦在下而受險者故下三爻言出險之道上卦在上而治險者故上三爻言設險之道猶恨二五皆陷於險中故二不能盡出險之功五不能盡設險之道文王當如燬之時身不上而民不瘁可謂能盡出險之功矣周公制禮樂立政刑以起八百年之業無敢侮之者可謂能盡設險之道矣故曰險之時用大矣哉離離下離上畜牝牛吉牝柔而牛順皆坤象也坤之二五來麗於見龍飛龍之位麗乎中正也所惡於柔順者為其麗於邪也如柔順若離之二五則無惡於柔順矣故曰畜牝牛吉坤以全體配乾而行故為牝馬為行地離以二五附乾而居故為牝牛為畜養麗天麗土日月麗乎天而成明百穀草木麗乎土而成文故離為文又為明重明以麗乎正柔麗乎中正重明以麗乎正此統論一卦之義以釋卦名也上卦為重明下卦三爻皆麗乎正故曰重明以麗乎正句中加以字如同人之文明以健賁之文明以止皆論上下兩卦之體也柔麗乎中正此以二五成卦之爻釋卦辭也坤之二柔來麗乎乾之中五麗乎中二麗乎正中如人能附順乎大中至正之道則其行無所不通故曰柔麗乎中正故亨是以畜牝牛吉也加是以二字明柔附本非令德以能附麗乎中正是以吉也苟附麗乎邪則為匪人矣安所得吉哉乃化成天下上卦為重明之君下三爻皆麗乎正之人此為明君能化成天下之象明矣明兩作日君象也不容有兩故明之兩作者則為大人繼明之象繼有前後之義非並作也日繼日猶君繼君有天子諸侯嗣位之象焉故曰六五之吉離王公也重明繼明繼明與重明不同重明猶重巽也明之又明猶新之又新也重明如言聖益聖繼明如言聖繼聖也初九初九麗之初也相麗之初不可不謹邪正錯然並陳於前一舉足履之便有得失榮辱之機所以欲其敬者未論求福且欲避咎也六二坤之六五黃裳元吉及索而成離乃以六二為黃離元吉者自坤言之六五坤道之最盛者也處盛而用柔中故為元吉若離則乾之本體而坤來文之其義以明為主乾之九二本自文明而坤之六二又以地道之光來居其位光明如此而以柔順中正將之故曰黃離元吉得中道也六五又加重明焉居剛在上而明熾於外此固知道者之所憂也安得為元吉乎九三不鼓缶而歌則大耋之嗟凶句法與不節若則嗟若同日既昃矣不動而求樂則坐而待憂也九三動為震震為鼓為聲互坎為缶又為擊缶之聲鼓缶而歌古樂也詩陳風用之古文嗟下無凶字九四六五六五之出涕戚嗟説者皆以為九四所迫非也九四突如其來豈為六五哉為九三既老前明將盡急於求繼爾九四逆子也突然而來迫天地之所不容也故曰焚如死如棄如無所容也六五順子也以繼父為悲以承業為憂不以得位為樂凡天子諸侯之初嗣位皆當如此故曰六五之吉離王公也曹丕初受漢禪抱辛毗頸曰君知我喜否識者有以知魏祚之不昌則四五之吉凶可知矣上九六五舜初繼堯讓德不嗣禹初繼舜稽首固辭之時也上九誅四凶征有苗之時也嗣位之主固當以憂畏為先然亦不可以不振也有上窮而不服者則動而用其明去其首惡安其黨與則有正威定國之譽而無反側不安之咎矣嗣位之初不得已而用明於外張皇六師無壞我髙祖寡命而已若察見其黨則人皆不安咎孰大焉出征言王不言公者公初嗣位無得征伐之理征伐者王者之事也折首首者上窮之象離折其首則變而為豐冝照天下所以為有嘉也豐亦有折獄致刑之象醜醜有二義老婦士夫亦可醜也負且乘亦可醜也二醜為羞辱離之獲匪其醜漸之離羣醜也二醜為朋類周易玩辭卷六
