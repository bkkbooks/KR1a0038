body:
  text: 周易玩辭卷三宋項安世述泰乾下坤上否坤下乾上泰否二彖以天道言之內隂外陽則死內陽外隂則生以人道言之內柔外剛則為小人內健外順則為君子以世道言之內小人外君子則為亂世內君子外小人則為治世合而言之消長二字而已否則凡屬君子之道者皆消凡屬小人之道者皆長泰則反是故二彖皆以消長終之否之匪人言否塞不通無復人理也不利君子貞言欲以君子之道正之使通當否之時非有大人之道能入否以致亨則當循君子之義儉德以退避若欲正之使變塞為通必無可免之理孔子論蘧伯玉史魚其意可見矣否則有所不利泰則物無不通君子小人皆得其亨故不分利不利歷觀史傳凡小人得志必害君子君子得志未嘗使小人失所故泰於吉之下又加一亨字明泰之福所及者公物無不遂也若但言小往大來吉則疑於大者獨吉而福不及小人矣上下交而其志同也分不可交其交者志而已否之匪人天下無邦以一身言之則為匪人以天下言之則為無邦上下不交隂陽斷絶其惡如此健順剛柔否言內柔外剛據其物言之也在泰則成德矣故曰內健外順以德言也匪人無德故不言德彖具三義泰否之彖皆具三義第一假曰天地交而萬物通也上下交而其志同也此以重卦上下為義於隂陽二氣無所抑揚但貴其交而已第二假曰內陽而外隂內健而外順內君子而外小人此以卦體內外為義雖在內在外各得其所要是重內輕外則已於隂陽有所抑揚矣第三假曰君子道長小人道消也此以六爻消長為義十月純坤既極陽自復生至三為泰乾三陽長坤三隂消所以成泰至此則全是好陽而惡隂以陽長隂消為福則不止於抑揚而已否彖則依此推之大抵諸卦皆然如小畜之彖柔得位而上下應之是統論六爻五陽一隂也健而巽却以兩卦言之剛中而志行又以九二九五兩爻言之故彖之義無所不備不可以一説通也泰否二象天地變化草木蕃故泰之象曰后以財成天地之道輔相天地之宜以左右民天地閉賢人隱故否之象曰君子以儉德避難不可榮以祿泰象獨隂不生獨陽不成隂陽交然後萬物泰人君法之以立道將以納民於泰其可有所偏乎財成之恐其太過也輔相之恐其不及也曰財成曰輔相曰左右皆交修之義也以德言之哲謀肅乂聖以治言之正直剛克柔克以事言之平秩平在敬致以術言之逆順寧彌逺皆財成輔相之目也財成其道所以左右民德也輔相其宜所以左右民生也道屬天宜屬地左又屬天右又屬地否象儉德辟難不與害交也不可榮以祿不與利交也此君子所以體天地不交之象也世固有假辟禍之名以保榮祿者故聖人必兼言之不可榮猶言不可得而榮非戒其不可也儉德又屬地之嗇不可祿又屬天之髙泰否下三爻泰之初九君子始以類進君子難進故聖人勉之以征欲其以及人為念不以獨善為樂故曰志在外也否之初六小人始以類進小人進則為邪故聖人戒之以貞貞則君受其福邪則君受其禍故曰志在君也泰之九二進而得中聖人喜其能包小人也否之六二亦進而得中聖人幸其能承君子也泰之九三君子之極盛也無所復勉憂之而已否之六三小人之極盛也無所復戒羞之而已小人在內德不當位反使君子在外而包之名位愈髙羞辱愈大故曰包羞位不當也當否之盛時小人以為榮聖人獨指其本心之辱者以示之使知榮辱之實在此而不在彼也泰否上三爻泰至於四將變為否故小人與其鄰翩翩而下入此小人之所同願故曰中心願也否至於四將變為泰故君子與其疇相麗而求福亦君子之所同願也故曰志行也泰之五在羣隂之中獨能降心下賢以受元吉之福其實衆皆願下而五以在中所下者二遂得所歸故曰中以行願也否之五在羣陽之中獨能撥亂休否以建大人之功雖其才足以有為然亦因在君位遂得為之故曰位正當也泰之上六泰復為否否之上九否復為泰聖人於泰之終則追恨其所從來曰其命亂也於否之終則幸其速去曰何可長也爻辭以傾否為喜亦幸辭云易以隂陽相得為喜先不相交而今交矣故曰先否後喜拔茅乾之初爻為震坤之初爻動亦為震震草在下艮手反拔之故否泰初爻皆有拔茅之象隂爻能變乃得為陽故否取變象言小人能變亦可為君子也以其彚以其鄰疇離隂陽皆以類而進退故泰否之初皆稱彚以其主下三爻之進退也泰之四稱鄰否之四稱疇以其主上三爻之進退也包荒包承苞桑易中稱包者皆謂陽包隂也泰之九二君子自內而包外故曰包荒荒者逺外之名也否之六二君子自上而包下小人在下承之故曰包承承者下載上之名也泰之君子固為光大否之小人亦足致吉者皆以其得中不為已甚之事也然而君子當否之時欲包小人而受其承非有大人之道者不能於否中致亨也入獸不亂羣入鳥不亂行涅而不緇磨而不磷惟大人能之故曰大人否亨不亂羣也乃若君子之常道則為儉德辟難而已否六二所稱之大人即九五之大人也凡木根衆而包土深者謂之包九五以乾陽下包而六二以坤土承之故在五為苞桑在二為包承包字皆指五也泰九二九二剛而能柔其道中平無所偏倚能包在外之三隂與之相應如徒步涉河無所疑忌隂雖逺而不之遺陽雖近而不之比獨離其朋上合於六五之中行二五相易遂成既濟以此處泰不亦光大乎五交二成離故有光大之象二致五成坎故有馮河之象郭子儀之待回紇與魚朝恩裴度之待蔡人皆包荒而不惡馮河而不疑故盜賊小人意消心化其道愈大其德愈光其九二之謂乎泰九二六五泰之所以成泰者以九二六五上下相交其志同歸於中行所以泰也九二之陽上交於五如舜之尚見於帝故曰得尚於中行九二之中行即指六五之中以行願也六五之隂下交於二如帝女之下嫁於諸侯故曰帝乙歸妹治泰之事皆九二主之六五同心以享其效而已故九二之爻辭言事甚多而不言其福六五之爻辭言福而不及事人君之道莫善於此故曰元吉帝乙歸妹帝女下嫁之禮至湯而備湯嫁妹之辭曰無以天子之富而驕諸侯隂之從陽女之順夫天下之義也往事爾夫必以禮義湯稱天乙或者亦稱帝乙乎商王名多相同以其皆用十干也否六二九五大人之道如龍之變化雖在否而不詘於否使之在下則入於其羣而否有可通之理故曰否亨使之在上則出乎其類而否有可止之功故曰休否二者皆天下之大事非大人不能也若論其常則居否之時正道不利但當儉德辟難不可榮以祿而已故否之彖象皆稱君子而二與五獨言大人蓋君子者上下之通稱故引之以明常道大人者非常人之得稱故引之以明非常之事泰九三無平不陂為三陽言之無往不復為三隂言之兩言無不者明此皆天道之必至而有孚者也人能知此則當泰之極不可不盡人事以防之艱則不敢易也貞則不敢弛也撫極泰之運而操心之危如此則舉動之際必無過咎夫然後彼之必至之孚可以勿恤我之固有之福可以長享矣乾之九三固能乾乾夕惕雖危無咎者也用以居泰不亦宜乎九三艱貞無咎上六貞吝九三上六其位皆正故皆得為貞九三將變而有陽剛之才能艱難以保其貞則可以無咎上六已亂而又以重隂處之其所謂貞者固守其柔不敢動作而已豈不為可吝哉九三勿恤其孚六四不戒以孚六四之徒樂於世變故以不戒以孚為遂其心九三之位正當其變故以勿恤其孚為自強其志彼方與其鄰背富而違實我當主持其類保富而食實故六四曰翩翩不富皆失實也九三曰勿恤其孚于食有福蓋六四居三隂之首羣隂所從以叛陽九三居三陽之上羣陽所依以拒隂此二爻者正相當之地故象曰天地際也凡隂為貧為虛為禍凡陽為富為實為福泰九三否九四泰九三於無咎之下言有福否九四於無咎之下言疇離祉者二爻當天命之變正君子補過之時也泰之三知其將變能修人事以勝之使在我者無可咎之事然後可以勿恤小人之孚而自食君子之福也否之四因其當變能修人事以乘之有可行之時而無可咎之事則不獨為一已之利又足為衆賢之祉也是二者苟有咎焉其禍可勝言哉泰上六泰之上六東周平桓之爻也雅降為風王降為國城復於隍也彼其之子不與我戌申勿用師也告命不出於王畿自邑告命也當是時也天命已亂閔默自守而已故曰貞吝若桓王帥諸侯以伐鄭則恥於貞吝而用師者也無德以造命而欲用力以勝之命其可得勝乎泰上六命亂否九四有命泰上變初為蠱自城之至髙復於隍之至深也泰上坤也蠱初巽也坤為衆巽為命衆變於上而命顛於下故曰其命亂也否之九四變初為益天地變而風雷作風雷皆命令之象故為有命當否之時羣陽將復苟無天命四雖有志可若何哉故曰有命無咎志行也泰雖極治以命亂而成蠱否雖極亂以有命而成益命者天之所令君之所造也道之廢興豈非天邪世之治亂豈非君邪自邑告命告自邑泰之自邑告命先言勿用師者因其不可用衆是以止於自邑也夬之告自邑後言不利即戎者因其告自邑所以不利即戎也泰之上六隂方叛陽若用衆隂令必不行自保其邑雖曰可吝猶未失於正也夬之上六陽方決隂若用一邑之人以攻五陽之衆勢必不敵但往而從之不保其邑猶為有利爾同人離下乾上大有乾下離上兩卦名一隂在下勢不足以有衆能推所有以同乎人者也故名曰同人一隂在上人同乎我為我所有者也故名曰大有彖於同人曰應乎乾明我應之也於大有曰上下應之明人應我也履卦柔在下亦曰應乎乾小畜柔在上亦曰上下應之此可以推卦例矣同人于野亨大有元亨同人乾之九二也見龍在田德施普也故曰同人于野亨有善世不伐之義焉大有乾之九五也飛龍在天大人造也故曰大有元亨有首出庶物之義焉同人曰文明以健中正而應君子正也意與九二文言相協大有曰應乎天而時行曰順天休命意與九五文言相協同人曰同人于野亨同人曰同人于野亨此句當連上文解之其説謂柔得位得中而應乎乾故其卦曰同人而同人之繇又曰同人于野亨也蓋本之以中正而無邪行之以剛健而無欲故能忘己而同人又能忘人而同乎野也故以兩曰字明之先儒皆以連下文故其説不通下文利涉大川乾行也獨以健行二字解利涉一句爾乾在外故曰乾行言出行於外健則能涉也同人應乎乾大有應乎天兩卦皆以離之中爻為主而以乾為應者也同人離在下以德為主故曰應乎乾者應其德也大有離在上以位為主故曰應乎天而時行者應其命也履兊在下曰應乎乾大畜艮在上曰應乎天亦卦例也應乎乾乾行也同人以一柔為主徒柔不能以同乎人也必以天德行之故雖得位得中而必應乎乾乃可謂之同人至於利涉大川則又曰此乾行也明非柔之所能辦也凡卦之以柔為主者皆然履之六三不能以自亨也必曰應乎乾是以履虎尾不嘻人亨小畜之六四不能以自亨也必曰剛中而志行乃亨大有之六五不能以自亨也必曰應乎天而時行是以元亨凡此皆柔為卦主而其濟也必稱乾焉此乾之所以為大歟元亨説具鼎卦利涉大川易中卦辭有利涉大川者八卦非乾則巽蓋北方屬水乾行涉之海居東南巽木涉之也需訟同人大畜四卦皆以乾行為象者也需之乾自下而上故曰利涉大川往有功也訟違乾而下行故曰不利涉大川入于淵也同人曰乾行大畜曰應乎天皆專以乾為訓也蠱益渙中孚四卦皆以巽木為象者也蠱之巽自下而往故曰往有事也益自震而巽二木相繼故曰木道乃行渙曰乘木有功中孚曰乘木舟虛皆專以巽為訓也頥之爻辭六五以柔不可涉大川上九以剛利涉大川亦四卦取乾之義也謙之爻辭初六用涉大川以二至四有坎為川然以無乾巽不得言利涉也利君子貞單言利貞則貞者守正而已矣君子之貞則通天下之志而一之也否以不通故不利君子貞若固守之貞則否之初六亦有之矣利涉大川乾行也彖以利涉大川為乾行明利涉者乾也非離也離有伏坎在下為川又有互巽在上為舟雖有涉川之象矣然非乾之健行不能以利涉也訟天與水違行故不利涉同人天與火同故利涉未有違天而可濟者也未有不健而能濟也文明以健中正而應文明以健則其健也非妄行中正而應則其應也非私係發之以明行之以公此君子所以合天下之志而正夫一也同人之道莫利於斯矣同人文明以健大有剛健而文明文明以健先明後健由明智而逹天德也剛健而文明先健後明秉天德以照萬事也此皆以卦體言之若以爻言同人得中正之理於內而外應乎乾行亦先明後健之象大有得尊位大中而上下應之亦有先健後明之象同人大有二象君子觀天火之同則知天下之物雖曰萬殊隨其類而觀之則同於樂得其志而已此君子之學所以能同乎人也辨謂明見其情而治之觀天火之照則知為人上者必明賞罰章好惡以恭行天命此君子之政所以能大有為也天命謂天討有罪天命有德也學以知之故曰通天下之志政以行之故曰應乎天而時行同人類族屬乾之五辨物屬離之二大有遏惡揚善屬離休命屬乾也同人六爻同人卦有亨利而爻無全美初九方出門之初得失禍福惟其所擇固非他人之咎上九在國外處逺而無同亦非己之悔也然二爻者於同人之義皆未有得初尚未可知上已無望矣故獨於上曰志未得也郊與野異者野以曠蕩言郊喻其逺而已三四不得中道而恃力以求同四以柔自反猶可得吉三以剛懷毒終無所施亦皆無同人之效獨二與五可以言同而又皆係於應無大同之量非所謂同人于野者也二專於柔眷戀宗戚之私情固為吝道五專於剛以離合為悲喜竭其力以與三決僅幸一勝此於交友之分可謂斷金若曰同人之道豈其然哉故爻辭不復有言而其道之吝自可見矣同人九三伏戎于莽處下卦也升其髙陵望上卦也三歲不興終不與五爭也安行者安分而行也始望而終安之故不言凶爻言升言興象言敵剛皆明敵在上卦恐人誤以為攻二也三離為戈兵下有伏坎故為伏戎五為髙位下有伏坤故為髙陵自三至五厯乾三爻故為三歲凡陽卦稱歲隂卦稱年三與五逺故為升其髙陵四與五鄰故為乘其墉弗克攻象恐人以弗克攻為力之弱故釋之曰義弗克也又曰困而反則也言能顧義知困復循乾則此即春秋褒弗克納之義也觀此則知九二之不克訟亦非不勝而歸蓋九二居中履柔能自反而逃其患也凡爻言不克者皆陽居隂位惟其陽故有訟有攻惟其隂故不克訟弗克攻訟之九二九四同人之九四皆是物也同人上九大有初九大有與同人反對大有之初九即同人之上九皆逺於柔者也故同人六爻獨上九為不得志大有六爻獨初九為無交也然而六二當同於人而上九獨不見同此二之吝非上之傲也故為無悔六五受人之交而初九獨不往交則害於大倫矣故為有害雖然豈其咎哉居勢適然豈容強合若能危行言遜艱以自守則雖無上下之交亦足免於咎也馮衍梁鴻之在東漢皆居大有而無交者也衍退而自修可以無咎鴻作五噫之辭為章帝所惡則失於輕易違初九克艱之義矣無交害也小人害也大有之時以上下交孚為利而初獨無交三或弗克交其害不亦宜乎若以無交害為無害則小人害也亦可為小害乎凡言害者皆不利之名也有攸往無咎九二大車以載有攸往無咎象曰大車以載積中不敗也蓋以不敗解無咎也二受大有之寄而能持之以中故其載雖重而可以有行無敗也公用亨於天子公用亨於天子左氏傳卜偃以亨為享陸氏釋文諸家易説亦皆作亨獻之義或謂亨字當改作享字非也古文亨與享同但作享義解之不必改字也大有中爻大有六五為主初獨無交逸民也上在其上賔師也獨中爻三位為臣二大臣也受大有之任故為載三外臣也奉大有之物以朝貢故為亨二以中故無咎三以不中故有戒君子用亨則為威文小人弗克則為曹馬矣四近臣也以柔自抑不怙大有之寵故為匪其彭干寶云彭亨盛滿貌也居寵思危惟明者能之四居離之初能明於初故為辨晳六五居離之中有中孚之象為信體柔為順履信思順而上下應之則其孚交矣所慮者居易而忘備故云威如吉欲其自警畏也或謂當以威肅下非也以柔順之資撫大有之運自有易忽無備之象觀家人上九象辭可見威如之義在己而不在人也大有上九六五在本爻但見其履信思順而已至上九而後見其尚賢故孔子曰又以尚賢也蓋當大有之世受羣下之應未足為大羣下已至而又能尊賢乃足以為大也有羣下易有大賢難武王必得箕子而後為大有不至於此不足以言大有之成也故大傳以此為六五之全德而象辭亦曰大有上吉明事關全卦非止上爻也此猶師之上六論師之事至此而終其言大君蓋指六五非謂上六為大君也小畜上九論畜之道至此而成稱月與婦亦指六四非謂上九為婦也大有初九大有上九兩爻象辭皆稱大有者明他卦在初而無交未為有害當大有之時乃為有害爾他卦上九乘六五未必如此之吉當大有之時尚賢如此乃為吉無不利爾二爻皆即全爻取義故以卦名冠之人字大字同必言人明我能同人非本同也猶家人以男正女指女為人也有必言大明小能有大非本大也猶大畜以隂畜陽指陽為大也謙艮下坤上謙亨彖曰謙亨天道下濟而光明地道卑而上行此以卦體釋卦辭也九三乾也降在下卦而萬民服之是下濟而光明也坤地道處勢至卑而升在上卦是卑而上行也下濟與卑皆釋謙字光明與上行皆釋亨字自人事言之尊者行之則有光即天道下濟而光明也卑者行之則不可踰即地道卑而上行也始雖謙下終必髙明是有終也必稱君子者以君子之心行之則有後福苟非其人如共工王莽之象恭得罪於天雖欲有終得乎自天道虧盈以下皆極言謙之必有後福質之於天地神人之心以明有終之義也謙謙君子勞謙君子初六九三皆稱君子者此二爻皆非小人之所宜處也初在謙之下過謙者也小人用之則為柔佞矣君子當不得已之時用之以柔身濟難則求吉之道也故曰卑以自牧牧者馴養六畜之名也三有大功為萬民所服小人處之則有不賞之禍君子處之致恭下人以保其終則庶乎其獲吉矣故二爻皆言吉而象皆再言君子其意深矣用涉大川吉利涉大川者未必有險也但其道自利於濟險耳用涉大川者非利之也有險在前用此可以免凶也六二上六六二鳴謙象以中心解之上六鳴謙象以志解之豫之初六鳴豫象又以志解之然則凡言鳴者皆志也志有憂有樂皆寓於鳴當豫之時人志以從上為樂當謙之時人志在下不以上為樂也二在下卦之中如其所欲故其鳴為得志上在上卦之上欲下而不可得故其鳴為未得志此非小象辨之則後世必不敢分為二説也雖然二之得吉固為吉矣上謙已極方病過中豈可更得志乎不得志於外而用三之剛以自治其內乃上六之利也故曰鳴謙志未得也可用行師征邑國也凡言邑者皆指近言之坤為國故曰邑國撝謙不違則鳴者情發於聲撝者用在於手謙卦以柔居柔者三爻皆誠於謙者也二與上情藴於中而不見於用故徒有其聲鳴焉而已惟六四一爻適當其用故以撝言之何以見四之當其用曰以其在三與五之中而見之也三為大功之臣五為柔順之主四居其中當貴臣之位使接三不用其謙則必有抑功臣而激其變如盧杞之於唐者承五不用其謙則必有挾柔主而弄其權如中常侍之於漢者謙於此時無往不利施之於用正得事宜故雖以柔而不為失則也萬民服也征不服也六五處謙之時非樂於侵伐也三以獨陽為萬民所服己既下人人亦下已故可以止於謙無所復為也五以隂柔居尊位已雖降謙人未免有不謙者故必用侵伐以一之帥衆謙以攻少不謙固不患於不利又不謙者去則天下皆謙故又為無不利也居謙之上當亨與有終之時故不言謙但言謙亨之效不富以其鄰不待賞而服者同謙者也利用侵伐待刑而後服者不謙者也二者皆服則無不謙矣無不利六四先言無不利明所向皆利於如此言所施之宜也六五既言利用侵伐又言無不利明自此之後無有不利之事言所收之效也六五上六六五利用侵伐上六利用行師此二爻皆與卦材爻德不類者居謙之極當反為豫豫利行師故皆有行師之象也五居君位故利以征人上無民故可以自征五居剛故不假用師上居柔故必用師而後可上之所用蓋用三也謙自二至上皆師卦也三在師中為萬民所服即師之懷萬邦也師之六五利執言故此六五亦利侵伐師之上六與六三之小人相應故戒以勿用此所應者九三之君子故勸以可用也六爻謙之六爻惟九三為不得不謙者故其取義最重餘爻皆弱自無不謙之患也三以重剛獨陽為衆隂所服功大德尊不謙則無以保其終故惟三之謙足以繫一卦之義初最在下二柔而中四柔而正皆無嫌於不謙者但嫌其多謙耳若五之居尊上之處極謙而不已則為過矣必能用剛以治人之叛攻己之偏而後為利也故五以侵伐為利而不言謙上以征邑國為利而不得遂其謙聖人之意蓋可見矣大象地中有山兼具兩義自山言之居髙而能下則以謙裁己者也自地言之髙者下之下者髙之則以謙裁物者也裒多益寡所以象山謂分人以財不以自殖教人以善不以自髙此在己之事非謂奪甲豫乙也稱物平施所以象地謂有禮者殖之昏暴者覆之虧盈而益謙惡盈而好謙此治人之事非謂以物子人也然大象皆實地中有山豈有其實乎曰此正實象也以天下之勢觀之地之最下而負海者其中最多大山非地中有山而何若曰地下有山則不可耳周易玩辭卷三
