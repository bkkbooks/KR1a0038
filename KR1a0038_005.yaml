body:
  text: 周易玩辭卷五宋項安世述噬嗑震下離上彖剛柔分分者未合之時一剛在內分隔三柔此其所以當噬也動而明則二體合矣合而章則大化亨矣此三句皆解噬嗑亨也噬嗑而亨何事不利而獨利用獄者六五以柔在上才不當位不足以致大利獨以柔得中利於用獄而已聖人不得已而用獄以噬頑民使合於善惟柔中者能之故曰柔得中而上行雖不當位利用獄也此兩句解利用獄也舜之刑曰刑期于無刑民協于中臯陶之刑曰好生之德洽于民心曰制百姓于刑之中成王之刑曰寬而有制從容以和曰惟厥中穆王之刑曰哀矜折獄咸庶中正皆以柔中為主也利用獄明罰敕法利用獄以實治人所以懲之而使合也明罰敕法以象示人所以禁之而使合也雷電伏則萬物息雷電合則造化通故曰雷電合而章此二物之功用也故用獄者取之隂陽相噬而有聲則為雷有光則為電二物因噬而合故曰電雷噬嗑此二物之形象也故立象者取之六爻本象先儒皆以初上為受刑之人二三四五為用刑之人析六爻為兩說故於所噬之象穿鑿紛紜終不能合殊不知六爻皆即本爻取象初九在下故為滅趾趾即初之本象也上九在上故為滅耳耳即上之本象也豈必二三四五乃指他人之膚肉哉六二以柔居柔在六爻之中至柔者也故為膚膚之在中者為鼻六三以柔居剛故為臘肉肉之不中者為毒此所謂臘毒也九四以剛居柔故為乾胏骨在肉中者為胏即剛在柔中也六五亦以柔居剛為乾肉而不為臘肉者三在下而小小物之乾為臘也二三四五言噬初上言校者爻在頤中則能噬初上在其兩端可以言校而不可以言噬也校之施於體亦有噬之象焉初九六二噬嗑惟初二兩爻正故皆得無咎之全餘四爻皆不正故有吝艱厲凶之疾六二象辭六二乘剛亦得無咎者他卦以乘剛為危噬惡者以乘剛為利也二以柔而在卦之中猶鼻以膚而在面之中也鼻有膚而無肉最為易噬又乘剛焉如膚在齒上故噬之則滅鼻滅則氣絶而不通矣非但滅趾之比也初滅之於下可以禁其足未可以絶其心也二滅之於中則其念絶矣故止惡者莫速於初而絶惡者莫要於二所以二爻皆得全其無咎自三以上為力漸難於是有吝有艱厲有凶此自治者所以貴於知務也九四六五四五兩爻稱得金又皆用貞者下卦為閒尚淺故用力易上卦為閒已大故用力難非貞不濟也四得剛直之才為金為矢可以去閒矣然以所居不正未能充大故必艱貞而後吉先艱後貞者明所遇者艱非才之罪能以貞勝雖艱可吉也五得剛中之位為黃為金可以去閒矣然以其才不當位故必貞厲而後無咎先貞後厲者明五本非才雖貞猶厲但正得當中故可免咎而已彖言不當位當字去聲謂非正位也爻言得當當字平聲謂其當中也通一卦言之六五最利者以其為噬嗑之主得中而上行於用獄為有利也以各爻言之九四最吉者以其為頤中之閒噬至於此則閒合矣此其所以吉也大抵噬嗑諸爻噬於淺者皆可無咎噬於深者雖吉亦艱就其淺者言之三已稍難故遇毒而小有吝就其深者言之初則艱中則厲終則凶矣故六爻之中無全利者蓋除閒之時但以得亨為幸未暇求利也噬胏得矢噬肉得金九四六五皆有噬有得者噬道將終必盡其慮也噬者除其惡得者取其善聖人之用法非專於除惡也有惡則去有善則取愛而知其惡憎而知其善此所謂中也此所謂利用獄也故於九四則噬其乾胏之强而收其金矢之用於六五則噬其乾肉之强而收其黃金之用聖人之待强梗其仁如此而强梗之於聖人未必皆退聽也故又用艱貞之力以成其吉操貞厲之心以免其咎舜禹之待三苖周公成王之待商民其得此義也夫人臣當九四之艱故曰遺大投艱于朕身人主當六五之厲故曰邦之安危惟兹殷士上三爻噬嗑上三爻離卦也九四離之初故曰未光也六五離之中故曰得當也上九離之極故曰聰不明也離主目坎主耳離極則傷坎火旺則水囚故耳受其病雷電噬嗑石經作電雷噬嗑朝公武氏曰六十四卦大象無倒置者當從石經賁離下艮上賁亨小利有攸往賁之卦辭微夫子之彖則後之說者其誰通之賁亨謂內卦也小利有攸往謂外卦也二剛為質而以柔文之則卦之內體固有能亨之道也及內之一剛分往居外反使二柔為質而以剛文之卦之發用如此豈堪大事哉故小利有攸往而已大扺以柔文剛則順以剛文柔則悖蓋其質既弱則文無所施也凡卦之法以內卦為主事外卦為發用故夫子釋之如此文明以止人文也獨隂不文獨陽不文一隂一陽而後成文故惟賁為不嫌於異有文之者有止之者而後人文成矣禮以節文二字為訓蓋謂是也賁喜異噬嗑好同二卦正相反天文人文剛往柔來謂之天文則天文以二爻變卦言也故曰以察時變文明以止謂之人文則人文以離艮成卦言也故曰以化成天下總論卦義古人之於文不敢一日離也古之聖人謂人之情不可以徑行也使夫人而可以徑行則將無所不至是故因其羞惡辭遜之節而為之文以飾之其交也以禮其合也以義百拜而飲三辭而受六禮而㛰所以飾其情而養其恥也荀子不知而以為僞晏子不知而以為勞戰國之君以為迂闊西晉之士以為鄙吝獨伏羲文王周公孔子以為此所以奉天命之變成人倫之化不可以一日無也故曰觀乎天文以察時變觀乎人文以化成天下今觀賁之六爻無一爻凶咎者雖疑者亦終於無尤雖吝者亦終於有喜聖人之貴文如此若之何其以庸人之不便而遂訾經世之大防也哉大象山為質火文之火在山下而不在山上者文可以表質不可以滅質也故賁之用可以明庶政而不可以折獄用文以修明庶政則周之禮樂庶事備也不亦可乎用文以折獄則張湯杜周賢於臯陶矣豈所以求民情哉明庶政屬離不敢折獄屬艮六二上九六二柔來而文剛主內卦之文者也內卦以文為文故曰賁其須須之麗於身最為虛文也然陽氣不盛不足以賁其須則須與陽同其盛也故曰賁其須與上興也二與上交而成卦二以上為主猶須以陽為主也聖人言此所以深明文之與質未嘗相離也故不言吉凶明吉凶之繫於質也上九分剛上而文柔主外卦之文者也外卦以質為文故曰白賁白本非所以為賁也然文之初興必自質始則白固在衆采之先文之既極必以質終則白又在衆采之後是則白者賁之所成終而所成始也故曰白賁無咎上得志也以艮之白遇賁之飾本非得志之時以其在卦之終主賁之成是以得遂其篤實之志聖人言此所以深明質之與文未嘗相悖也故言無咎蓋行與時違疑於有咎也九三六四九三六四在兩卦之交其文皆盛而不相得三以乾之重剛而處離之上賁之發揚而明麗者也其文光澤而可鑑故曰賁如濡如詩所謂六轡如濡也四以坤之重柔而處艮之下賁之隂靜而篤實者也其文淳白而無華故曰賁如皤如白馬翰如人與馬俱白言德與位俱靜也兩爻相近而相反如此故其情不得不疑然三有剛正之質非徒文也以正守文孰能傾之又何慮於四哉故曰永貞之吉終莫之陵也凡卦至四而變四當爻位之變與三相反誠有可疑之迹然而四亦居正非相畔之人也文明之與篤實純剛之與純柔濡如之與皤如非相為寇實相為婚剛柔相錯離艮相交天下之至文也而於四何尤焉故曰六四當位疑也匪寇婚媾終無尤也在賁之時以相雜為文兩爻體性雖異終歸於文故兩象皆以終為言賁如皤如白賁賁如皤如者其文自白如白羽之白白雪之白也白賁者以白文之如斫雕為朴狀貌尚忠也翰如姚小彭氏曰商人尚白戎事乘翰翰與皤皆白色也六五六五艮中爻也艮上爻為山故中爻為丘園丘園者束帛之所由出也戔戔者委積之貌自賁之時言之不賁其宫室而用力於丘園之中植桑柘積絲帛可謂吝矣要其終則束帛委積而百禮可行黼黻文章之用祭祀賔客婚姻之儀皆由之成賁孰盛於是故雖吝而終吉也吝屬艮終吉屬離艮與離合故有喜凡諸卦言有喜有慶者皆取隂陽相合之義上三爻賁上三爻皆若與卦相反故其初皆不為人所明四以為寇致疑終以婚媾而無尤五以務實見吝終以成功而有喜上以處賁而白若當有咎終以在卦之終而得志蓋朴素篤厚之人其初常若悖時而難合及其父也察其本心之相成見其事理之當然始足以免尤而致喜蓋必至於終而後得志也六爻初最在下為趾君子之飾其趾惟不以不義汙之則天下之至榮也初九剛正而在下故其象如此二以隂麗陽而成離蓋附人而得飾者也故為須須不能自賁附頤而得賁然而無譏焉者凡物之相麗自外至者為邪由中出者為正須由中出者也六二柔麗乎中正故其象如此三居離之極文盛而溢故為濡如暗弱者居之則文獻日亡國勢日削九三剛正有餘但能守文不失則人莫敢陵周魯之亡非文之罪不能守其文之罪也故以永貞勸之三當賁道之隆四當賁道之變自三以下屬離故下三爻皆以文為賁自四以下屬艮艮為篤實而主白故上三爻皆以白為賁四與三切鄰三以純陽用文四以純隂止之三方濡如四一變而盡白故有相寇之疑然賁之時義正欲以異為文如異姓相交而為婚姻非四之過舉也五為柔尊而不主事有后妃之象焉用其賁于丘園治束帛以為文章此婦人之文也上為成賁之主有能止之勢又居至極之時其義當止故用其淳白而得志於上此人君之文也諸爻皆自賁者也故以賁字冠句首上九為賁之主賁人者也故賁字在下君以淳白賁外治后以淳白賁內治四為大臣又以淳白自賁君臣家國共行篤厚之化以正天下之文彖所謂觀乎人文以化成天下者其此之謂乎剝坤下艮上彖朝公武氏曰剝剝也至小人長也以六爻言致剝之象也順而止之至天行也以二卦言處剝之道也彖象凡諸彖所言皆六爻消長之象也凡大象所言皆八卦取物之象也以剝之六爻言之隂自下而長以剝乎陽若更上往則為小人滅君子之象故曰不利有攸往小人長也以剝之物象言之山自上而剝以附乎下下厚則山愈安是為君厚其民之象故曰山附於地剝上以厚下安宅上削而下廣山形之所以安也大抵卦有吉凶善惡而大象無不善者蓋天下所有之理君子皆當象之遇卦之凶者既不可象之以為凶德則必於凶之中别取其吉以為象焉剝與明夷是也人君無用隂剝陽之理則當自剝以厚下君子無用暗傷明之事則當自晦以蒞衆凡此皆於凶中取吉也諸大象之例皆然故大象與彖無同義者苟同義焉則無所復用大象矣六爻本象剝之初六於時為姤剝乾成巽巽為木故有牀象所剝者下爻也足者牀之下木故曰剝牀以足六二於時為遁剝巽成艮艮為背則牀剝而至背矣辨者牀之上木故曰剝牀以辨六三於時為否剝艮成坤背已在地故不言牀六四於時為觀亦剝乾成巽巽為木復有牀象然所剝者人也故曰剝牀以膚六五剝道成矣剝巽成艮剝膚及背背者後宫之象故曰貫魚以宫人寵上九不剝者也艮在上為果為廬坤在下為輿為民陽復於下則為得輿而載民之象隂極於上則為純坤果食而廬剝矣自膚而至宫人自宫人而至廬剝之序也凶無咎無不利剝本不假言凶初二言凶者姤遁之時初患未深二德中正而尚可救正未遽凶也無能正之者夫然後凶故曰蔑貞凶蓋猶有責望之意也至三為否世事已去上無援下無救德位俱無坐而待剝自取之也尚誰咎哉四復言凶者凶之成也禍及身矣初與二之所憂者此也臨之彖曰至于八月有凶即此爻也五君也禍已入心猶為之謀其利者天下之亂惟君為能止之雖壞可興也小人之所以為國家之禍者以其乘君子之器而已若使君子自治國事居公卿之位小人自以鱗次當官府之役如男治外事女治內事雖王后三夫人九嬪二十七世婦八十一御妻森然並列受寵於內亦於國家何不利之有無不利有二義此無不利猶言無害非無往不利也天道豈能無小人人道豈能無女子但處置得冝則自無剝剛之禍矣然此英主之事非六五所能為也聖人特著此以開後世救剝之路耳上九當剝之終巋然獨存其吉凶皆不可料天若祐晉則為謝安之止桓溫而天下皆得所載天不祐漢則為王允之死於㴶汜而小人亦相隨而俱亡斯二者天也故此一爻獨無吉凶利否之占聖人之意深矣剝無咎臨至於二乾道已成故曰元亨利貞曰至于八月有凶剝至於二剝道已成故六三曰剝無咎事至於成已不可咎矣按釋文爻辭但曰剝無咎有之字者非然則有之字者蓋因小象之字而誤增爻辭也小象設問剝之所以無咎則不得不用之字爻辭本無問答何以之為以宮人寵剝之六五隂爻已入君位若以宮人言之則五為王后與君同處四為夫人佐后者也三為九嬪以主九御下卦之長也二為世婦初為御妻五者循序而進以治隂事以當夜時猶剝之五隂但用於午未申酉戌之月亦在天道未為不利也若用於陽月以侵發生之事則為厲氣爾易道廣大六四已言君道之災故此爻别明後宫之義以見用小人者但以此寵之則無害也小象剝六爻小象皆以君道言之蓋君子小人消長之際乃人君切身之利害也初為民位剝初則無民矣故曰以滅下也二為臣位剝二則無臣矣故曰未有與也三在遁為臣妾之爻不言臣妾者非成敗之所關上無臣下無民也則其勢足以亡矣故曰剝之無咎失上下也四為肌膚剝四則君無身矣故曰切近災也是故五不言君但以宮人當之以明待小人之道上九在外為元氣之未亡者以明用君子之道五隂雖盛若以宫人處之不與國事則終無過尤一陽雖孤若收而用之則譬之得輿下民終得所載惟不可以小人雜之若使小人在上雖當危極之時亦必妬賢害國不亡不止終不可用也聖人為人君推明用人之道至是切矣故兩爻小象皆以終言之示其決也終不可用也小象皆協韻獨剝上九以載字協用字豐九三以事字協用字則古音用字皆通入志字韻矣以字訓用意者用亦可以作以歟復震下坤上卦辭剛之反也動而以順行是以出入無疾朋來無咎此人事之當然也反復其道七日來復天行也此天理之必然也在天則有必復之理在人則顧其所處如何無必勝之理也出入無疾朋來無咎君子之復也必人無疾之者而後可以朋來而無咎使在我者行不順而施不恕則於出入之際既有疾之者矣雖欲類進其將能乎賈彪所謂相時而動無纍後人此之謂也朝公武氏曰自剝至復入也自復至夬出也臨泰復之朋也為內卦曰來反復其道七日來復反復音覆來復音服復與剝相反剝卦覆而成復故曰反覆其道剝之初升為上上降為初一與六爻則其數七故曰七日來復兩句皆以剝言之不必泛指他卦也剝不利有攸往復利有攸往剝曰不利有攸往小人長也復曰利有攸往剛長也易之意凡以為君子謀也聖人謂復其見天地之心吾亦以是見聖人之心也天行也剝曰君子尚消息盈虛天行也復曰反復其道七日來復天行也道之興廢皆是天命商旅不行后不省方商旅象坤坤為衆也后象震帝出震也當是時也外之行旅之人未可行內之出震之君未可出皆象雷之在地也彖取陽之復來故可以出人可以朋來可以有攸往象取雷之在中故不可以行不可以出彖與象取義不同諸家與彖同說則非衆象之例亦非此象之義也無祗悔悔與復不同復則改之不但悔也祗能悔而不能改則不足與言復矣坎之祗既平字義同此以修身也陽之初復非以勝人以修身也聖人之意深矣此即商旅不行后不省方之意也必如此而後可以出入無疾朋來無咎利有攸往休復休者喜也見初之能復喜而慕之亦與之偕復也何以知其喜而慕之曰六二在羣隂之中獨為中正之人與君子同體而中心比之非喜而何凡隂皆惡陽來二獨喜之此其所以吉也頻復頻蹙也六三不中不正不足以語復然當復之時初二兩賢同心相好三與之近首為所蹙其勢既危不容於不復然危而能復亦合於補過之義故得無咎也六二喜而復者中正之人也六三畏而復者不中不正之人也三以不正而復猶得無咎四以正而復不言無咎者三在下卦非用事之人但在身有過而已故既復則可以補過也四在上卦為用事大臣其朋邪剝膚之罪大矣能復僅足以贖罪又可言無過乎中行獨復四行於五隂之中蓋羣隂之用事者也當復之時獨與來復者應蓋有變而從道之意亦足以贖罪矣不言吉凶明無吉與凶也敦復無悔以其國君凶二與初比四與初應三與初同體者也獨五上二爻與初無交上窮隂而不反故災眚凶敗並至而不可解五雖無交然能以厚德從容中立自保非迷暗之人在復之時亦足以免悔矣要之陽復非諸隂之利故三止於無咎五止於無悔惟六二一爻中心相喜又皆在下是以吉也復以上六為君道故六五不取君義蓋以胡廣趙戒之徒厚重而中立為一世之望者當之上六則中常侍張讓之徒以漢俱亡者也隂盛之時君道常為小人所以故曰以其國君凶又曰反君道也事若在君則為亢陽不為窮隂矣上六居純坤之極坤為十故曰至于十年不克征泛言災眚恐與諸卦同故别言行師用國之禍以明其凶之大且久也敦臨敦復敦艮臨以上六為敦臨艮以上九為敦艮皆取積厚之極復於五即言敦復者復之上爻迷而不復故復至五而極也卦中復者五爻初最在先故為不逺五最在後故為敦敦雖訓厚而有重遲之義復之遲者當有悔而五無悔者以中自保故得免悔玩小象之辭可見爻辭意在遲緩故象以中釋之也臨上六復六五臨上六之象曰敦臨之吉志在內也復六五之象曰敦復無悔中以自考也二象皆一問一答臨之在後者不應得吉其吉者何與二交也復之在後者不應無悔其無悔者何中以自考也考者成也自成而已象之發明爻辭大率如此迷復行師二最近初故為休復上最逺初故為迷復喜則相親迷則相仇上六即坤之上六龍戰之爻故有行師之象蓋與初戰也無妄震下乾上彖卦辭曰無妄元亨利貞彖曰剛自外來而為主於內動而健剛中而應大亨以正天之命也此即初九之無妄往吉得志也而六二九五兩爻之得正者從之卦辭曰其匪正有眚不利有攸往彖曰無妄之往何之矣天命不祐行矣哉此即上九之無妄行有眚無攸利窮之災也而六三九四兩爻之不正者從之其匪正有眚鄭剛中氏曰陽復妄消之時惟利正者其匪正者皆不利也故曰元亨利貞其匪正有眚豫以鄭說演之則此彖蓋與否相類矣否之時匪人得志則不利君子貞無妄之時元亨利貞則匪正之人皆不利有攸往蓋此所謂利貞即否之君子貞也此所謂匪正即否之匪人也又因是推之天之命也亦當與復剝之天行也同意無妄之時剛自外來而得為主於內動而不屈中而有應大道亨通而萬事皆正天命之也匪正之人當是時也往無所之天不祐之也道之興廢物之終始皆天命也先王之制獨能對時以育物不以人汨其天爾非能有所加損也剛自外來而為主於內無妄自遁來下卦本艮一剛在外來內為初遂為一卦之主爻也對時育物時以象天物以象震對時育物以天育之也物與無妄者物之生無不得乎天也茂對時者君之政無不對乎天也六爻無妄之時以誠滅妄以陽滅隂凡陽皆勝凡隂皆不利初九剛自外來而為無妄之主所往皆吉可見陽之得志矣故曰無妄往吉得志也六二居中守正異於他隂矣猶戒曰不耕穫不菑畬則利有攸往加一則字蓋疑之也故曰不耕穫未富也隂為虛陽為富六二以隂居隂雖在無妄之中猶未得比於陽必能盡絶人為專用其天而後可以往配於陽也六三與九四同不得位而不得與九四比者三隂而四陽也六三隂不得位所應又窮災降自天末如之何矣或繫之牛不知其誰之物行人得牛不知其誰得之而六三端居其邑橫被其災此所謂無妄之災也九四陽雖不得位而其質剛體健無所係應固有之德可以自守不隨位而加損也故曰可貞無咎固有之也九五與初九同為得位五又居中而不得與初九比者初九無所係應故所往皆吉無妄之至也九五與隂相應故不免於疾然二五中正相應本非妄交故為無妄之疾無妄而攻之則為妄矣故爻戒以勿藥象戒以不可試皆深戒而嚴止之示無妄之時不可少妄也然辭旨憂疑終非得志之爻亦可見隂之為纍矣上九所居與九四同亦可守而不可行而上九又當時位之窮愈無可行之理故曰窮之災也即乾上九亢龍之爻辭也不耕穫不菑畬鄭氏謂若作不耕而穫不菑而畬是於本文外添兩而字也只是并穫與畬皆不為爾此說為當豫以田事考之耕者禾之始穫者禾之終菑者地之始畬者地之終六二當無妄之時居中守正上應純陽有去妄存誠之志然必併其始終而盡絶之無使一毫私欲遺種於其閒則妄盡而誠存矣苟有一毫未去便非純誠猶未得為無妄也不耕穫則利有攸往勿藥有喜二之利有攸往往與五應也五之有喜喜與二應也二爻相應本皆中正無妄聖人以六二為純隂故於二爻皆深戒之二之不耕穫不菑畬所以深絶其妄種也五之勿藥不可試所以深保其無妄之真也五已無妄懼其失之也故可以用戒曰勿曰不可皆戒辭也若二之隂柔使其有妄則徒戒不足以止之且息妄之事亦非他人之所能預必其中心自不耕穫自不菑畬然後為真爾故皆曰不以見其自不為也若待戒而止則可以為難矣未可以為無妄也未富也小畜九五富以其鄰泰六四謙六五不富以其鄰升上六消不富也皆以陽為富隂為不富若無妄之六二則進於陽矣但未純耳故曰未富也臨之九二以四隂在上為未順命然陽長隂消終必順矣觀之六三以九五在上為未失道然隂長陽消終必失矣凡稱未者皆謂其未遽然非謂其終不然也無妄之災新安朱先生曰無妄六爻皆無妄也其所遇之災非人為也故六三為無妄之災上九為窮之災皆不害其為無妄也周易玩辭卷五
