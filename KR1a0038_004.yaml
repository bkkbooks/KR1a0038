body:
  text: 周易玩辭卷四宋項安世述豫坤下震上利建侯行師屯之時九五屯膏而初九為濟屯之主故為利建侯豫之時六五貞疾而九四為由豫之主故亦為利建侯行師由我而豫非建侯乎朋盍而濟非行師乎屯之初豫之四皆震之初爻主器之長子也故皆有建侯之象屯動乎險中故為建侯而不寧坎為憂故曰不寧豫順以動故為利建侯行師坤為衆故曰師剛應而志行九四一剛言應猶小畜六四一柔言柔得位而上下應之也剛應即朋盍簪志行即志大行也刑罰清刑罰清而民服非謂簡省刑罰以恱民也言順理之事不煩刑罰而民自服如日月四時無裁抑之者而其數自不相過其氣自無差忒皆順動之驗也時義時用豫隨遁姤旅皆若淺事而有深意故曰時義大矣哉欲人之思之也坎睽蹇皆非美事而聖人有時而用之故曰時用大矣哉欲人之别之也頥大過解革皆大事大變也故曰時大矣哉欲人之謹之也人死於過而生於頥頥受六十四卦之終氣故頥大過之時與解革同其大也大象豫之大象言作樂者凡豫多不善遊豫逸豫怠豫戲豫皆非君子所尚惟樂者先王之所以飾喜也以此為豫與天地祖考同其樂則無惡於豫矣然樂亦有鄭衛故必曰崇德明非淫樂也曰殷薦之上帝以配祖考明非自娛也聖人之為豫慮可謂深矣崇德猶章德也説文曰作樂之盛稱殷崇與殷皆盛大之意雷樂雷出乎地而奮乎上樂作乎下而薦乎上其義一也作樂崇德皆下之順事也薦上帝配祖考皆所以感動乎上也六二六三凡物之兩間為介介所以分也許氏説文曰介分畫也當豫之時五弱四強人莫能分六二辨於去就之分如介於石間斷然易識不待事成故吉終日謂成事也六三介於狐疑之地既上視而不能去又遲回而不能就故多悔二爻之相反中正與不中正而已中正之人則能早辨故曰以中正也不中不正之人則不能自決故曰位不當也六二六五二貞吉五貞疾者二正而五不正也貞於正故雖違衆而吉貞於不正是貞於疾也疾可貞乎君弱臣強是在疾證為陽虛而隂實雖久而不亡何樂之有然而君昏於上臣治於下臣尚戴君天命未改中位未亡謂之疾可也謂之死不可也此其平王之後威文之時乎初六六三九四豫之主也天下之豫由我致之猶急於朋合不敢有自矜自怠之意初六小人也見己之應為主於上即矜誇自鳴其志已極能無及乎六三見四之得志仰而慕之已為可悔又不決然從四徘徊觀望以自後於朋合之時則又可悔之甚者也有字即古文又字古周易又多作有大抵人之常情居豫之時不矜則怠是以禍亂相尋倚伏不休抑亦先覺者是賢乎則六二其人也以往事驗之初六則弦黃之恃齊以為豫者也六三則曹衛之慢晉而自豫者也六二則微子之去箕子之留比干之死分義所在坦然明白於殷周未判之先中庸所謂前定之豫也非中正之人其孰能之謙九三豫九四謙之九三伊尹周公之事也書曰臣罔以寵利居成功記曰有庇民之大德有事君之小心即易之勞謙也豫之九四齊桓晉文之事也首止之會踐土之盟即易之由豫也勿疑朋盍簪勿疑朋盍簪按釋文簪字或為撍或為寁音或為子甘反或為子感反其訓皆為速也疾也王弼作易傳盡廢先儒之説獨簪字仍訓為疾蓋古訓有不可易者此類是也豫之時上下怠慢治之之法以齊速為上故二以不終日得吉三以遲有悔九四以大賢之資居可為之位仗陽剛而履柔順為上下衆隂之所宗仰所宜速合羣類以扶王室豈可更有疑緩之心以滋其怠哉孔子曰相桓公霸諸侯一匡天下民到於今受其賜微管仲吾其被髮左衽矣此正豫之九四也聖人導之以大有得勉之以勿疑而速合其愛天下切矣管仲曰宴安鴆毒不可懷也薑氏曰懷與安實敗名皆明於由豫之機者歟三四居上下之交故兩爻皆有遲疑之戒上六上六冥豫成有渝無咎成者極也豫極則昏故曰冥豫成豫之反為謙謙則無豫怠之咎上之變為晉晉則無冥暗之咎故曰有渝無咎凡言渝者皆當以變卦觀之六爻初六恱樂之豫也六二先事之豫也六三猶豫也上六逸豫也諸爻豫義各自不同然皆因九四而生故九四為豫之主隨震下兊上天下隨時隨時之義釋文云王肅本作天下隨之隨之時義大矣哉按此則上時字為聲之誤下時字為字之倒也或曰古時字從之故之時二字易雜然則皆字之誤也大象震朝氣也兊暮氣也春入於秋歲之暮也卯入於酉日之暮也木入金鄉則絶雷入澤中則蟄人入晦時則息皆隨時之明義也初九同人之初曰出門同人又誰咎也隨之初曰出門交有功不失也同與隨皆貴於正大不可有所私昵故皆以出門為貴官有渝貞吉官主也初九為一卦之主以乾之上九與坤之初六相變而成隨上九初六本皆不正因變而得正遂有動説之象故曰官有渝貞吉此一句論卦之始變二爻相易此隨之本也即卦辭所謂剛來而下柔動而説隨也出門交有功欲其捨內卦之二隂從外卦之正應此一句却論成卦之後上下之相隨此隨之用也在變則欲其改不正而為正在應則欲其捨不正而交正隨之貴於正如此即卦辭所謂大亨貞無咎而天下隨之也初九九四當隨之時近者易昵初九近於六二九四近於六三隂陽之情以近而相隨則隨之失道者也初與四雖俱為陽然以正應相隨則隨之合道者也初九當出門之初尤所當謹故欲其交有功之人謂隨四也四有明善之功故曰有功於九四則欲其有孚在道謂隨初也兩陽以正相孚則所孚在道而不在情復之四從初九亦謂之從道初四互離為明明於邪正之辨則其所交自然無咎故曰孚於道者明之功也六二六三六二係小子失丈夫象曰係小子弗兼與也六三係丈夫失小子象曰係丈夫志舍下也説者以丈夫為正應非也凡言係者皆非正應以私意相牽係爾凡言失者謂正應也本應有而今亡之故謂之失六二與九五為正應係初九則失九五矣以二陽言之故初為小子五為丈夫也六三與上六為正應係九四則失上六矣以隂對陽言之故六為小子九為丈夫也丈夫小子特言其大小之别爾非有所謂抑揚也上卦以上六為上九四為下六三之志止處於下必不從上故曰志舍下也舍止也蓋六三不正之人故其辭之決如此若六二則姑言邪正不可兼得而已蓋資稟中正者或能自擇所隨若其資不正則無望矣六三九四六三曰隨有求得利居貞九四曰隨有獲貞凶此皆言三四相隨不得其正也三之與四以隂求陽無不得者但據理言之有得者不足以為利而居正者乃所以為利也四之於三不求而得可謂有獲矣然揆之正道則為有凶也蓋三與四本非正應又以六居三以九居四皆為不正非元亨利貞之義也三若能居而不求以固守上六之正應雖均是隂而合於義在隨之德乃為利也四若為道而不為獲有孚於初九之正應雖均是陽而明白無邪在隨之道乃為有功也聖人之言功利一出於正如此與後之言功利者異矣隂相隨止於利陽相應故可以立功孚于嘉五之嘉在二婚曰嘉禮亦曰嘉耦非正應不足以當之象恐後人誤以九四為嘉故釋之曰位正中也其為九五六二明矣今人猶有誤指九四者以九四爻辭亦有孚字然不知孚字可通用而正中二字不可通用也上六隨之極當變為蠱上兊變艮昔説而隨我今執而止之故曰拘係之乃從維之明人心之變也兊為西艮為山震之一陽升於西山之上故曰王用亨於西山明已亦自變也在變卦伏卦反對卦三象皆然事勢至此不得不變故曰上窮也凡易言窮者皆謂其當變然窮而能變是亦隨時若與之俱窮則非善隨者此隨之義所以大也方當世變盡力以求通吉凶皆未可知故不言凶用亨大有九三公用亨於天子隨上六王用亨於西山益六二王用亨於帝升六四王用亨於岐山四爻句法皆同古文亨即享字今獨益作亨讀者俗師不識古字獨於享帝不敢作亨帝也若天子與山則或以為無享理不知賔禮自有享王吉禮自有山川之祭也凡稱享者正謂其有以通之雖作亨音亦止言享禮爾西岐西山在宗周故國雍州之西今隴西西縣諸山南漢水之所出也梁州亦有西縣乃東漢水之所出在周之南非西境也享岐山者不出國都享西山則從其方而祀之亦乃從維之之義也六爻二三上言係者皆隂爻也隂之隨人也以係係者私情也四五言孚者皆陽爻陽之隨人也以孚孚者公道也此可以見隂陽之情蠱巽下艮上元亨隨元亨彖謂之大亨蠱元亨彖仍曰元者人情説隨無所阻礙事已遂矣故謂之大亨蠱壞之時凡事創始亨自此始故曰元亨大亨者恐其蕩也故繼之以利貞無咎元亨者方經營之既欲其為之勇又欲其慮之周故曰利涉大川又曰先甲三日後甲三日蠱甲巽庚巽九五之變為蠱巽者事也事變至蠱則當復始故於蠱謂之甲甲者日之首事之始也蠱之六五復變為巽蠱既始事巽又申之事之申重者非更則續故於巽謂之庚庚更也續也蠱以全卦言故於卦辭言甲巽至上卦而後為重故於九五言庚甲庚者十日十二辰之綱也戊巳分王四時自甲歷乙丙丁三日而至庚自庚歷辛壬癸三日而至甲故取以為三日之象也三日甲庚之先後皆稱三日先後者上下卦也三日者三爻也先甲三日蠱之下三爻巽以行事也後甲三日蠱之上三爻止而不行又將復蠱也天道自巽而艮復自艮而巽故曰終則有始天行也明事未有不蠱蠱未有不復造者此以天道言也故不言吉凶先庚三日巽之下三爻行事之初我與民皆未敢信也後庚三日巽之上三爻行而又行我與民皆信之矣故曰後庚三日吉明初猶未吉至終而後吉此以人事言也故以吉終之大象振民象風在下育德象山在上山下者人禽草木之所聚風於其間鼓蕩回薄飛走動植為之紛然事莫盛於斯矣父母朝公武氏曰蠱非一日之積必世而後見故諸爻皆以父母為言初六初六隂柔本非幹蠱之才然蠱之成卦乃因坤之上六來為初六則初六者成卦之主也故聖人於此爻詳言治蠱之事專取卦主為義不論其才也又去柔居剛亦有志於治蠱者故象取其意而爻戒其危焉初六有幹蠱之志九二有內幹之才九三有外幹之才大抵蠱下三爻皆能幹者以其巽體主於行事也意承考也幹父之蠱迹若不順意則承之也迹隨時而遷久則有敝何可承也孝子之於父不失其忠愛之意而已不可貞相承謂幹母者不可太剛非也夫謂之幹母則已明其居柔用柔止可幹隂事自無太剛之慮矣不可貞者言其自幹母之外他事不可守此以為常法也若幹父事如此則不勝其任矣母道失則強故當以柔濟父道失則弱故當以剛舉也往見吝裕蠱蠱主於作事故利涉大川往有事也往有事為利則往未得為吝矣朝公武氏曰裕益也秦二世以就始皇之宫室為孝衛州吁以修先君之怨為孝皆裕蠱也安世按裕者長其惡也若二人則逢其惡不止於吝而已六五六五之才雖不足於幹然得尊位行大中能以令名掩前人之蠱者也故曰幹父用譽承以德也言不以才幹而以德幹也大抵蠱之上三爻皆非能幹者以其艮體主於止也上九居蠱之終則無事之時也在蠱之外則不當事之人也然當事者以幹蠱為事不當事者以髙尚為事亦各事其事也故不曰無事而曰髙尚其事事得其宜非宜幹而不幹者故曰志可則也六四在事中而不事則可吝矣六爻蠱六爻皆以剛為貴初與五以柔位剛亦得吉譽九三剛而不中在他卦多凶而於蠱獨無大咎惟六四一爻位與德俱柔遂以見吝以此見幹蠱涉川非剛不濟也上九無預於事亦以剛介為髙卦爻總義蠱卦之體巽伏而不動外剛而內柔有致蠱之象而其諸爻乃有治蠱之才九二以柔行剛能幹母之蠱者也九三以剛行剛能幹父之蠱者也初六六五皆資柔而志剛亦有幹蠱之志初在下而承乾故為意在承考臣之事也五在上得中而應乎乾故為德足以承考君之事也初當治蠱之始故為厲五享治蠱之成故為譽方承繼之初驟有所改以迹言之但見其危安得有譽惟識者察之知其意非悖父爾及事定之後人被其德乃始信其為孝而稱譽之治蠱之難蓋如此夫臨兊下坤上臨者大也易之卦義不專取字訓但因事立義耳人之所需者以飲食為急故需為飲食需不訓食也人之所行以禮為重故履為禮履不訓禮也治蠱者必有事故曰蠱者事也蠱自訓壞不訓事也能臨物者必大故曰臨者大也臨自訓涖不訓大也彖元亨利貞指六陽之卦也八月有凶指二隂之卦也二陽方長雖未成乾而已有乾之德亦未至成遁而已有遁之禍聖人豈好為是豫言哉二陽之長必至於乾者天道之當然也其長如此其消亦如此者亦天道之當然也故曰大亨以正天之道也八月有凶消不久也皆以天言之然則撫消息盈虛之運者其可不勉其所必至而防其所將及哉雖以天言而人事之當謹者固在其中矣彖象彖言以剛臨柔自下而長以臨上之四隂也象言以髙臨深自上之坤以臨下之兊也象取物象與爻象不同皆此類也大象澤上於地人所防之澤陂堰是也澤有時而決其所容亦有限地中有澤自然之澤巨野洞庭是也澤無時而窮其所容亦無限臨下之道莫善於此矣以政臨民猶堤中之水以教臨民猶地中之澤教民之念既無時而窮則所容保之民豈復有限哉放勳曰勞之來之匡之直之輔之翼之使自得之又從而振德之禹曰戒之用休董之用威勸之以九歌俾勿壞所謂教思無窮者此之謂也以字義言之教思無窮屬兊容保民無疆屬坤初九九二初九九二皆臨隂者也以陽臨隂反在隂下有男下女之象故皆為咸夫之臨婦其道如此初者臨之始也以九居初既正而所感六四又正固守其正者也雖其志可尚然不周於用吉在自守而已九二不主於貞而主於中則善用其臨者也此以中感彼以中應君安之衆信之故不獨其身之吉而行之於世亦無不利也蓋二陽初長四隂方盛猶未肯順聽其命必用中而後為利若直行吾志必不利於行也故象於初九則曰志行正也於九二則曰未順命也於六五則曰大君之宜行中之謂也聖人當剛長之時其為君子慮可謂深矣陽進至三為泰則外順矣九二六五猶以中行為福而況於未順命之時乎九二六三九二剛長而得中故無不利六三隂消而不中故無攸利二以心感人三以口説人此君子小人之所以分也六三六三以甘媚臨而無攸利見君子之難説也既憂之無咎又見君子之易事也其處已也嚴故不受不正之媚其與人也寬故不治既憂之人爻辭雖為六三言之然可以見二陽之用心矣餘見大壯上六六四六五以應九二而得吉上六以志在內而得吉六四與初九正應獨不得吉五為大君四為大臣五方用九二以臨衆隂三四不中首當斥去四得無咎已為幸矣此保位之臣非大臣也故曰位當而已六三六四三與四皆以隂柔而在髙位三以説媚陽故雖咎而不長四以順應陽故得無咎其所以勝於三者三不當位四當位也臨六五家人上九臨六五曰知臨大君之宜後世必有以苛察為知者矣故曰大君之宜行中之謂也言知在知人使中正之賢得行其道不在遍知也家人上九曰威如吉後世必有以刻下為威者矣故曰威如之吉反身之謂也言威在自畏不在威人也夫子贊易大抵如此故謂之贊謂之翼也三四五上臨卦隂爻皆以當位為吉四當位故無咎上當位亦無咎三不當位故無攸利獨五不當位而反吉者五君也二陽之所恃非二陽之所臨也陽來臨隂凡隂類皆當用柔惟大君為宜用剛何則自下臨上暗君之所疑也君剛則與陽相知不疑其臨已故曰知臨五能知二則二之中道得行於上故曰行中之謂也舜之所以為大知者以其能用中也擇乎中庸而不能守則謂之不知孔子以行中解大君之宜而知字之義亦因以明矣上三爻臨以上卦臨下四最在先與下卦至相逼故為至臨上最在後與下卦隔四隂故為敦臨敦者積厚之名也五不先不後獨當其中與二相知故為知臨相知者宜於得吉相逼者僅以位當而得無咎上與二無交若從當位之例無咎可也而又得吉何哉蓋臨之上二有相交之理非他卦比也臨與頥互相易頥之上二相交而成臨臨之上二亦相交而成頥以交二而言則可以得五之吉以當位而言則可以得四之無咎是以為吉無咎也雖然其無咎易見其吉難知故夫子獨解吉字曰敦臨之吉志在內也內即九二敦即頥之上艮也明與二合志則上化為艮遂成由頥之主此其所以兼四五之德而有之也觀坤下巽上觀字音觀字卦名并一卦內並是平聲惟觀天下一字是去聲爾序卦以可觀解卦名雜卦以或求解卦義皆下觀上也彖之觀天象之觀民六爻之所觀無一可作去聲者頥與觀互相變故頥之卦辭爻辭皆用觀字然亦止是平聲大觀大壯觀四隂方盛以二陽為大大壯二隂在上以四陽為大不論其多寡上下而論其德也盥而不薦古之君子不必親相與言也以禮樂相示而已此所謂觀也然猶假禮樂未足以言大觀也則不見而章不動而變無為而成不言而信不怒而威不賞而民勸不怒而民威於鈇鉞篤恭而天下平無聲無臭而萬邦作孚此所謂大觀也故曰盥而不薦盥者祭之初步方詣東榮盥手於洗凡祭之事百未為也薦者祭禮之最盛四海九州之美味四時之和氣無不陳也齋明盥潔無所陳布而有孚顒若已不可掩蓋相觀而化其神如此故謂之神道也先儒謂盥則誠意方專薦則誠意已散盥而不薦謂專而不散非也仁人孝子之奉祀也豈皆至薦則誠散乎此但以盥而不薦象恭已而無為爾非重盥而輕薦也如所謂不動而變不言而信豈以言動為不美哉但不煩言動而已神道神道者形容觀字也凡有言者有事者皆以迹治未可以為神也觀則不言不動相觀而自化此以為神也不察者以為别有神道是不逹觀義也天不言而四時自不忒此天之神道也聖人恭已無為而天下服其至教此聖人之神道也記曰天道至教聖人至德味此二言可以知觀道之神矣童觀窺觀初六為下民故曰童觀言其於觀也如童子之時未有知識也下民日用而不知則其常也君子而不著不察則可羞矣故曰小人無咎君子吝六二在中饋故曰窺觀言其於觀也如婦人之目所窺者狹也婦無公事所知者蠶織女無是非所議者酒食此在女德不失為貞男子而寡見諛聞則可醜矣故曰利女貞亦可醜也二爻皆小人之安於下者也故獨論其德以為非君子之事而已六三以不正之隂處下卦將革之時遂有窺伺君子之意故方論其情狀也又在上下之交故有進退之象觀我生觀其生五為一卦之主以中正觀天下為天下之所尊仰凡言我者皆指五也觀卦四隂進逼二陽初稚二貞未有凌陽之勢六三不正之小人在下卦之上其志剛躁將進而逼陽以成四隂之勢者也時以九五中正尚未失道故未敢遽進方觀九五之所為以為進退故曰觀我生進退未失道也為九五者知其如此則當自觀我之所生以為休咎之決民向之則我為君子民背之則我非君子也故曰觀我生觀民也民即在下之衆隂也上九當剝之時在卦之外無民無位小人之進退下民之向背皆不由己但謹視其身思自免咎而已非卦之主故但稱其生此即剝之君子觀象之時也隂進則滅陽而為坤隂不進則陽存而為碩果道之興廢皆未可知故曰觀其生志未平也觀本是小人逼君子之卦但以九五中正在上羣隂仰而視之故聖人取之以為小人觀君子之象象雖如此勢實漸危故五上二爻皆曰君子無咎言君子方危能如九五之居中履正能如上九之謹身在外僅可免咎爾不然則九五建中正以觀天下雖元吉大亨可也豈止無咎而已哉明二陽向消故道大而福小也此即唐武宗之時內之宦者外之牛李之徒皆欲攻李德裕者也但以武宗剛明在位故仰視而不敢動一日事變則萬事去矣臨未順命觀未失道臨以二陽逼四隂九二尚用咸以臨之而不敢遽進者以隂方強盛未順命也觀以四隂逼二陽六三尚用觀以伺之而不敢必進者以陽方中正未失道也此兩象辭皆指所敵言之而諸儒往往求之於本爻所以未得其説也兩辭皆稱未者臨終當為泰觀終當為剝方長之勢決不但已特未而已非終於不進也故曰未尚賔也尚者配上之名賔者對主之稱舜尚見帝迭為賔主即其義也四隂方盛勢與五敵所幸九五未失君道而四又履正故其來止於尚見而為賔使其以不正相遇則為敵矣國有光則人賔之無光可觀則為敵可知故當觀之時聖人懼焉風行地上風行天上人不見其迹也風行地上則所加者偃所觸者動夫人而見之矣先王俯就其民而教示之蓋如此若彖所謂大觀在上則自以爻象言之乃風化之本原非此之謂也易之彖與大象取義不同方與民屬地省之觀之教之屬風我凡論全卦之義皆以主爻為我蒙以九二為主故彖辭稱我者九二也小畜以六四為主故彖辭稱我者六四也觀以九五為主六三所稱之我即九五也頥以上九為主初九所稱之我即上九也小過以六五為我中孚以六二為我皆統言一卦之義者也獨需三解三鼎二旅四自以本爻之吉凶而稱我非一卦之事也變卦主爻例反對卦皆自消息卦變一升一降而成卦以義重者一爻為主消息卦皆自乾坤變一隂一陽者以初上為主復夬乾之初上姤剝坤之初上二隂二陽三隂三陽皆以二五為主不反對八卦皆自坎離變乾之二五中孚之三四大過之初上皆與離之二五相易而成卦坤之二五小過之三四頥之初上皆與坎之二五相易而成卦兩升兩降亦以一爻義重者為主大過頥象一隂一陽之卦以初上為主坎離小過中孚象二隂二陽之卦乾坤象三隂三陽之卦皆以二五為主周易玩辭卷四
