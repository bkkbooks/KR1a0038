body:
  text: 周易玩辭卷七宋項安世述咸艮下兊上脢字查許國氏學於陸佃謂脢在口下心上即喉中之梅核今謂之三思臺者是也安世按喉中之核亦不能自思則亦與脊肉同為無思爾上下經上經首乾坤終坎離乾坤者男女之正體坎離者男女之正用也下經首咸恆終既濟未濟咸恆者體之合也既濟未濟者用之交也故上經為男女下經為夫婦咸恆咸曰觀其所感而天地萬物之情可見矣恆曰觀具所恆而天地萬物之情可見矣隂陽之情惟感與常而已往來無窮者感也相續不已者常也止而説動而相説則有相隨之義止而相説則有相感之義男有室女有家止於禮而相説所以為夫婦也若動而相説則踰牆鑽穴豈夫婦之道哉此咸之所以為取女吉也彖柔上而剛下二氣感應以相與亨也止而説利貞也男下女示取女之吉也九三上六二爻艮兊二卦皆柔上剛下之象山澤相感六爻相應皆二氣感應之象恆卦亦雷風相與剛柔皆應而不為感者雷風以聲與氣相輔而行非若山澤專以氣相感也以虛受人人知山之實而不知山之虛澤氣上升而山受之此其所謂虛也惟聖人知之故以虛受而法其象艮象下虛兊象上逹初六上六初上皆不言凶悔吝者當感之時柔在內者必應於外柔在外者必説於內皆其常理又所應皆正非妄感也故無凶悔諸儒謂滕口説為鄙之非也若鄙之則為吝矣事自有當用口説之時凡訓誥誓命皆口説也滕字虞翻本作騰蓋傳布之義書所謂播告之修也但專恃口説亦不為美故不得言吉輔頰舌咸上艮五皆以輔為象聖人懼其無别也咸曰頰舌見其動也艮曰言有序見其靜也頰舌二字當自為句六二九三九三隨人為吝六二隨人雖凶而吉者三剛故吝而不改二順故改而不害也三與上相感者也上性説三性執彼以口説我我執而隨之遂往而不可回故謂之吝二與五相感者也五為脊肉於人無感而二以腓肉自動而求之失中喪正而無得於外安得不凶然二性本順非固執之人若還居其位中正復全則雖凶而可吉也三上自否變而成咸若往隨上則復為否所以吝也二動則成大過不動則復為咸所以雖凶而吉也九四感在心者也拇腓股皆非所當感脢輔頰舌皆不足以感故特加咸字以明之九四咸之所也故不假言咸而言咸之道貞一而無悔者未感之初也憧憧往來各以其類而從其思者既感之後也未感之初未有利害既感之後能如其初之貞於至一而無欲以撓之則明通公溥萬物化生而天下和平矣如其未也雖三剛三柔上下往來皆以正應相從感則感矣終未得為光大也九四九五四與五皆在上體其尊相近故分主心脊之事五官之治皆主於心以九四當之五藏之絡皆係於背以九五當之四居上下之交有往來之象故為思而在心五以剛居四之外故為脢而在背心有思則有得失故必貞而後悔亡脢無所思故無悔志末者末即無也言無所志非淺末之末也六爻初以柔在下體之始故為拇不為趾者趾剛而止不受感也二以柔在下體之中故為腓不為脛者脛亦剛也三以剛在下體之上故為股柔在下而從應固其所也柔在中則可以上下故有凶有吉剛在上而亦不能處則其志卑下無可言矣四在三陽之中為心上在兊之上為口五在心之上與口之下上不為言下不為思故靜而為脢四在內而柔為心三在外而剛為脢脢即膂也下三爻皆感於人上三爻皆感人者也亦不處也九三小象亦不處也亦字亦上文也古者六爻小象自為一篇故接六二之小象而亦之言腓之柔固不能自處而股之剛亦復如之則為可吝也恆巽下震上彖剛上柔下其分正也雷風相與其情通也巽而動剛柔皆應循理而行內外應之其事順也有是三者足以久矣此卦之所以為恆也亨者以此而亨無咎者以此而無咎利貞者利固守此也故曰恆亨無咎利貞久於其道也其道即上三者可久之道也久非其道則有咎矣行何由而亨守何由而利哉守常者多不通多失之過多不利於行故此彖歷言之猶損之無咎可貞利有攸往也利貞恆之彖以貞為利而爻辭皆不利於貞者彖論卦德爻各言其位也卦得其道故當以貞守之爻多不正正者又不得中皆失其道不可貞也利有攸往聖人懼愎者之以執為久也故曰恆亨無咎利貞久於其道也明所久在道非妄執也又懼暗者不知道之所在也故曰天地之道恆久而不已也利有攸往終則有始也明道在不已所以能久也已者止也止則廢廢則不久矣書曰終始惟一時乃日新惟日新不已然後能終始惟一也日月得天而能久照天即道也四時變化而能久成變化即不已也日月得天以一日言四時變化以一嵗言天形一日一周而日月因之以迭照故曰得天天氣一嵗四變而四時因之以成嵗故曰變化久於其道立不易方久於其道道之所在則久焉非執一也立不易方方之所在則立焉非一方也道者理之會通也方者義之所在也非其道也非其義也頃刻不可居也奈何久立而不易乎股能立足能移今足反在上股反在下故為立而不為移浚恆貞凶初六既恆矣而曰貞何哉恆但為長久之義而已貞則有心於固執者也久於其道固執可也久非其道其可執乎初六隂柔不正以浚為恆固已近禍又加執焉凶之道也其何利之有六五居中在上以柔為貞猶有吉凶之辨婦人執之則為吉夫子執之則為凶聖人之言恆其貴於合道如此初六上六初六居巽之下以深入為恆也上六居震之極以震動為恆也在始而求深在上而好動皆凶之道也象辭加始字上字其義明矣在始求深如未信而諫未信而勞其民之類是也在上好動如秦皇漢武之類是也九二六五九二以剛中為常故悔亡六五以柔中為恆在二可也在五則夫也父也君也而可乎婦人從夫則吉夫子從婦則凶矣二居婦位而剛疑若有悔以能久中故其悔可亡無所容也無所容者謂動與靜皆不可也九三剛極而躁居上下之交非能常者也以妄而動必有羞辱承之或承之句法與或擊之同九三動則坎自外來矣承之猶應之也就使固守不動位亦不中常於不中亦為可吝蓋無往而非招羞之道故曰無所容也九三九四九三剛躁而不常九四以不中不正為恆不常者固無所容常而非其道者亦無所獲故曰恆亨無咎利貞者久於其道也六五六五象辭蓋互文以協韻也若順言之則婦人從一而終故以柔貞為吉夫子制命為義故以從婦為凶也大無功也師六三恆上六皆以大無功解凶字言敗績也雷風相與雷風恆雷風相與者其情也雷主聲風主氣聲之與氣相從而不厭者也雷風恆者其方也聲常在外氣常在內二物者天下之至動者也而其不易如此而況於所當立者其可易乎是以君子象之雷風恆風雷益恆者不易益者易地而相資者也巽入也而在內震出也而在外二物各居其位故謂之恆雷入而從風風出而從雷二物易位而相從故謂之益象於常言立不易方於益言則遷則改其義明矣遁艮下乾上剛當位而應剛當位而應與時行也此解遁而亨也遁本無亨之理故加而字若曰既遁矣而又能亨者剛雖當位而能應柔隨時用權不與為敵故有可亨之理也當位非謂居尊位也凡爻得正為當位言以正自居而以權應柔得遜遁之義如陳仲弓不忤中人故能脫潁川於黨禍此所謂遁而亨也小利貞小者元字之反對也元為大故此為小小字自為一德卦義以亨為主故移在亨字之下遁而亨者聖賢隨時之本義也小利貞者聖賢救世之微機也隂方浸長世道未至盡亡尚有可小小扶持之處天若未喪亦有興利反正之理此郭林宗周旋郡國誘掖人才之意也孔子之答陽貨即遁而亨也仕於季氏即小利貞也故曰遁之時義大矣哉自遁而上更進一隂則不利君子貞無復小利貞之望矣此徐孺子所謂非一木所支之時也天下有山山為髙矣而天形自逺終不可得而親天非有心於逺之也故曰君子之逺小人不惡而嚴乾為君父故嚴艮為少男故小初六六二以全卦言之六二為浸長之隂逼陽者也以爻位言之以六居二柔順中正止於其位蓋君子之固志於下確然而不拔者也猶初六亦是初長之隂在爻位乃為遁尾之君子也六爻惟二不言遁者初二皆在下之君子以初之危猶不必往二亦何以他遁為哉固守中德而不可解即其遁矣二為黃六為牛艮止為執革者固執之物也其取象如此以義言之當遁而執亦有改革之義六二九五六二之象曰固志也九五之象曰以正志也二爻皆在卦之中故皆為心志之象九三九三牽係而不能速遁以有疾則厲以畜臣妾則吉蓋疾以纒綿為困臣妾以係戀為恩也疾且不可况可大事乎象曰係遁之厲有疾憊也恐讀者以係遁為有疾故移厲字於上而釋之曰有疾憊若此則憊而難瘳也九三上九九三最近於隂又當位而止故為係遁有疾憊上九最逺於隂又不當位而健故為肥遁有所係則疾無所疑則肥上與三正相反也好遁嘉遁好遁嘉遁只是一意四之與初猶五之與二也四與初皆不得其正故其相應也謂之好言以情合也五與二皆中而正故其相應也謂之嘉言以禮合也然當遁之時好與嘉皆不當顧惟當遁去也四為不正未必能遁故有君子小人之戒五能正者也故又以貞吉勉之象曰以正志也言當以貞固而正其志不可以嘉耦而係其志也小人否否如字言小人則不然也讀為否泰之否者非若以小象當與上下文協韻則可否之否古音自協匪字也無所疑也坤六二無不利文言曰則不疑其所行也遁上九無不利象曰無所疑也小畜上九君子征凶象曰有所疑也疑則凶於行不疑則利於行然則疑者行之禍也是以君子超然不以其身處於嫌疑之地故無入而不自得焉逺小人者最慮其疑上九本不與之相應又非當位之人所以逺之而無所疑也六爻遁下三爻艮也艮主於止故為不往為固志為係遁上三爻乾也乾主於行故為好遁為嘉遁為肥遁在下位而不往者栁下惠也在內而能固其志者季札子臧也當遁而猶係者大夫種也乘相好之時而遁者范蠡也已為嘉耦而猶遁者子房也在事物之外肥而無憂者四皓兩生也大壯乾下震上大者壯也壯有小大二義撫劎疾視曰彼惡敢當我哉此小者之壯也居天下之廣居立天下之正位行天下之大道此大者之壯也聖人懼人之以很為壯也故釋之曰大者壯也明所壯在大不在小也猶懼其未明也於其釋利貞也又申之曰大者正也明大壯即是大正故下文但言正大而天地之情可見不言觀其所壯也子犯言直為壯孟子言大勇小勇其説皆出於此利貞壯有大小二義以正者為大而正字亦有大小二義有以事理得中為正者有以隂陽當位為正者剛以柔濟之柔以剛濟之使不失其正此事理之正也以剛處剛以柔處柔各當其位此爻位之正也大壯之時義以事理為大其所謂利貞者利守事理之正故曰大者正也明不以爻位言也是故九二九四六五三爻不當位而皆利初九九三上六三爻當位而皆不利又於九二九四爻辭明言貞吉於初九九三爻辭明言征凶貞厲蓋二四於事理為正故其正也利初與三以爻位為正故其正也不利由此觀之則卦辭所利之貞在大而不在小明矣聖人猶恐其未明也又以小象釋之於九二之吉則曰九二貞吉以中也明正吉以中而不以位也於六五之無悔則曰位不當也亦明無悔在中不在位也初九以剛居剛其仗正力行為可孚矣而象則曰其孚窮也言在他卦以孚為美當大壯之時則以孚為凶故孚至大壯而窮矣易之時義屢遷如此剛以動故壯剛則不為物欲所撓故其動也壯使以血氣而動安得壯消長凡消長卦復姤臨遁泰否夬剝彖辭皆言消長之事獨觀與大壯不言消長者已過泰否則消長定矣其事以夬剝為終不係於觀與大壯也大壯正卯之月四陽在下主宣萬物之華觀正酉之月二陽在上主堅萬物之實所繫者大故彖辭專言大觀大壯之理以明陽德無往不大不以消長為限也大象雷在天上行於天而不行於人動於剛健而不動於柔邪此其所以為天下之至壯也君子所以飬其剛大者亦曰非禮勿履而已內知非禮屬乾外能勿履屬震知行如此非至壯者其孰能之九三既曰小人用壯又曰君子用罔勸戒備矣又曰貞厲羝羊觸藩羸其角者恐人以用剛居剛為得正也大壯之時方以過剛為戒位愈正則愈危矣剛而又剛其剛不能自制必至於觸藩而羸角此其所以危也故必如九二九四之以剛居柔而後義正而事吉也羊新安朱先生曰此卦體似兊故稱羊焉蓋以六爻合而為三則是兊卦也羝羊觸藩九三上六皆在本卦之上三為健之窮上為動之窮故皆有觸藩羸角之象然三能用罔以化其健而為坤上能用艱以止其動而為艮則皆可免於羸蓋窮有變理也君子罔也君子用罔説者不同然觀爻辭之例如小人吉大人否亨君子吉小人否婦人吉夫子凶皆是相反之辭似難與小人同貶也又象辭曰小人用壯君子罔也全與君子好遁小人否也句法相類詩書中罔字與弗字勿字毋字通用皆禁止之義也九四九四以剛居柔有能正之吉無過剛之悔貞吉悔亡四字既盡之矣又曰藩決不羸壯于大輿之輹者恐人以居柔為不進也進陽以去隂豈有可倦之理故象以尚往明之自四以往為夬故為藩決不羸四本坤之下爻動而成壯故為壯于大輿之輹輹在輿下者也四為成卦之爻故稱壯稱大尚往大壯至四猶曰尚往夬已至五猶曰利有攸往蓋剛不盡長柔不盡消則其事不竟故曰剛長乃終此除惡務本之法自治與治國皆當如此不可以小惡為無傷而弗去也喪羊于易朝説之氏曰易古文疆埸字也今按場在兩界之間常有喪失牛羊之事故聖人取之以為兩爻相易之象大壯之時其性太很故六爻皆惡當位而喜易位九三止於純剛故粗很用壯而羸其角上六止於純隂故愚很不詳而羸其角惟九四六五易位而處四以剛居柔故藩決而悔亡五以柔居剛故羊喪而無悔四性剛未必能安於易位故先貞而後吉先悔而後亡五性柔能安於易位故為喪為易為不當位而居然無悔也四之所決即九三所觸之藩五之所喪即上六不退之羊三以剛居剛故貞則有厲四以剛居柔故貞則有吉此又貞厲貞吉之辨也大壯四五易位而喪其很故無悔旅五上易位而喪其順故凶此又牛與羊之辨也上六上六居動之極質本隂暗而又好動不能詳審者也是以進退失據凡人處事以為易則不詳以為難則詳矣上六既以不詳而致咎則當務詳以免於咎故曰艱則吉咎不長也此雖教戒之辭然上六亦自備此二義居動之極故有不詳之象動極則止故又有克艱之象聖人亦因其才之所可至而教之爾咎不長也臨之六三無攸利象曰既憂之咎不長也大壯之上六亦無攸利象曰艱則吉咎不長也二爻皆居卦之窮可以變通臨六三變則為泰大壯上六變則為大有故皆曰咎不長也晉坤下離上彖晉躋也古文晉作齊子西反康侯猶禮言寧侯也姚小彭氏曰康侯用錫馬蕃庶侯亨王之禮也錫猶納錫錫貢之錫亨禮四馬卓立九馬隨之故曰蕃庶也晝日三接王接侯之禮也覲禮延升一也覲畢致亨升致命二也亨畢王勞之升成拜三也明出地上順而麗乎大明此釋康侯用錫馬蕃庶也柔進而上行得中而應乎剛此釋晝日三接也馬日行地莫如馬馬象下卦坤也晝者大明之時晝日象上卦離也臣以馬錫貢於上順之至也上以晝日接下明之至也為下不順則不能進下順而上不明則不可進下順上明斯其所以晉也歟柔進而上行易彖辭言柔上行者皆謂六五噬嗑晉睽鼎是也今按噬嗑自否初進五晉自觀四進五鼎自遁二進五皆為上行獨睽卦以大壯三上相易五未嘗動則於例不通虞翻以為無妄之二進為睽五亦未為允然則當是離卦在上即謂之柔進而上行爾蓋三女之卦獨離柔在上為得尊位大中而行之故謂之上行巽在六四例謂之上合上同兊在上六例謂之上窮皆不得為上行也大象大壯之象曰君子以非禮勿履晉之象曰君子以自昭明德聖人之言壯言明大率如此世人以敢凌人為壯以能察物為明豈不逺哉明之出乎地非人進之自進而已明德之發乎身非人昭之自昭而已明德以象日自昭以象出地下三爻進也者君子之所難也初未為衆所允則不可以急於進也有晉之者有摧之者吾一以正處之而無所遷就則常吉矣吾獨行正人未受命吾以裕待之而無所怨尤則無咎矣此君子將進之道也二既進而當位則憂患之原方起於此但常固守中正不改其度則致吉之本也至誠上通君必福之不可他求左道以幸容恱此君子既進之道也至於三則已晉而在上晉道已成衆志皆信則異於罔孚矣凡悔盡亡則異於摧如愁如矣當是之時進而上行麗乎大明復何疑哉故曰衆允之志上行也然必至於三而後衆允則君子之進豈可以易言哉王母六五以柔居尊位故六二以王母稱之明事隂柔之君其初不得不愁必固守中正以感通之則君雖隂柔必福之矣周公之於成王用此爻也介者自守之象介即貞也福即吉也與詩之介爾景福不同故曰受兹介福明福自此生也鼫鼠紹熙癸丑余在館閣樓尚書鑰為余言晉卦釋文云鼫鼠螻蛄也今俗稱土狗者是先儒多以毛氏詩碩鼠為説誤矣余以許氏説文考之信然且云五技鼠也能飛不能逾屋能緣不能升木能浮不能渡谷能穴不能掩身能走不能先人今土狗之技盡與此合又按王弼注晉卦謂鼫鼠為無所守則亦以五技目之也但不知何代何人誤改苟子勸學篇鼫字作鼯故後之學者遂不知有鼫鼠之名然余按蔡雍勸學篇亦云鼫鼠五能不成一技則荀子書在漢時固未作鼯字也古易鼫字有一本作碩彼自以碩鼠解之可也若用彼説而解此字則為不識字訓不可行矣九四晉之道以順而麗乎大明以柔進而上行皆主乎順者也三雖不正以其能順故得信其志而上行四雖已進乎上以其失柔順之道故如鼫鼠之窮而不得遂若固執而不悛危必至矣故三五皆不當位而獨於九四言之也六三六五六三六五位皆不正本皆有悔者也三順而五明得君臣之道故皆悔亡五雖君位然以六居之在卦義為柔進而上行有人臣進而遇君之象自失得勿恤以下皆為進者言之也君子之進得遇大明之君則不當復以失得為憂但往而事之自然吉無不利象辭又曰往有慶也皆勉之以仕蓋明主可為忠言不當復為身計也此又因君之明而極言仕進之義三與五爻辭皆不稱晉然三之上行五之往吉非進而何上九晉好柔而惡剛故九四上九皆以厲言之四進而非其道故為技窮之鼠上已窮而猶進故為晉其角角亦窮地也是道也皆不可以施於人維用以自攻其私使常惕厲而不安則可以致吉而免咎然亦終非可久之道久則可吝矣此猶家人嗃嗃悔厲吉亦非治家之常道也爻象分合例臨之初曰志行正也二曰未順命也而晉之初爻合而用之乾之初曰下也二曰時舍也而井之初爻合而用之履之三曰眇能視跛能履而歸妹之二三分而用之既濟之初曰曵其輪濡其尾而未濟之初二亦分而用之凡此皆當參考其義以知分合之由明夷離下坤上彖晉之彖皆無元亨利貞等字句法全類爻辭明夷之彖以卦名與卦辭各當一事此皆新例也與諸卦彖辭不同文王箕子文王之難在外故曰蒙大難箕子之難在國家故曰內難文王以全卦言箕子以六五一爻言也蒙難者有濟世之功內難者止於正志而已艱貞內難艱也正其志貞也故曰利艱貞大象明而見傷本非善事然天地之間既有此象君子觀之皆為有用是道也用之以居人上聰明睿智守之以愚使小人有所容而君子得以自盡豈非君人之善道哉故曰風霆流行庶物露生無非教也嗚呼大象之辭非聖人其孰能修之蒞衆坤也用晦而眀以坤飬離也晉明夷大象明出地上君子以之自治明入地中君子以之治人旨哉斯言非聖人其孰能修之下三爻下三爻屬離皆明者也不在其位則去之在其位則救之終不可救則狩之故初九者海濵之二老也六二者伊尹祖伊之事也九三者湯與武王之事也六二守其常九三遇其變也上三爻上三爻屬坤皆暗者也六四暗而不中入逢其暗出行其權者也崇侯虎以之左者自卑以迎其君也坤為腹左者坤之下爻也六五在暗而中晦於大難迹暗而心明者也箕子以之上六暗極不反禍及其身者也桀紂以之六五君位而主箕子者此卦主為有明而見夷者設也紂不明之人故以上六當之言晦不言夷已則自晦非湯武夷之也初九六二垂其翼不言夷未傷也夷于左股加一夷字言已傷也説者以垂其翼為傷翼非也斂翼而下飛者避禍之象也用拯馬壯吉左為小右為大股在下肱在上豐折右肱故不可大用有臣而無君也明之始夷也臣雖受傷未忍忘君思用救馬盡力而出之當戡黎征葛之時夏商之王苟能用伊尹祖伊之言幡然而改遵道而行則其興也勃焉何患其不吉哉明夷二動則為泰何吉如之然而此非上六之所能也但為六二者臣子之法當如是爾故曰六二之吉順以則也釋文拯字作承古文作拯亦音承其訓曰上舉蓋拯而出之也而後人遂以拯代之義雖是而字則非矣明夷渙明夷六二用拯馬壯吉象曰六二之吉順以則也渙初六用拯馬壯吉象曰初六之吉順也安世按二爻雖柔皆自有坎馬正合順字諸家必欲外取剛爻謂六二以九三為馬初六以九二為馬豈未考小象故歟渙之初六坎初爻也明夷自二至四為坎六二亦初爻也坎為亟心之馬故壯馬壯則能力行矣然必於柔爻言之者貴其順也當險難之時力行順事則可以仄凶為吉若力行剛克則愈凶矣爻辭意在用字象辭意在順字明以六用壯可以得吉紂率其旅若林則以九用壯無得吉之理也明夷六二當位之臣忍傷以救國事合於為臣之則故曰順以則也渙之初六在下無位避難而自救故止曰順也申豐盡室而行蘧伯玉從近關出皆以順用壯而自救其身也救禍者莫若壯用壯者莫若順逹而能順可以救世窮而能順可以救身順以則也則者道之常也言以六居二得正得中明於臣子之常道也明夷之下三爻惟六二有救之之誠上三爻惟六五無去之之心皆中順之臣也上六失則者亦謂其失人君之常道也南狩離明坤暗九三自離狩坤乃為自夷狩南者未狩則為明夷狩則為南矣離既升坤則離在坤上非南而何詩曰肆伐大商會朝清明南狩之謂也不可疾貞貞字自為句為明夷而南狩不得已而為之匪棘其欲也有棘其欲之心則是富天下也故曰不可疾然而人之常情不急則懈故又以貞勉之今朕必往致天之罰貞也周易玩辭卷七
