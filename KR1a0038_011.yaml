body:
  text: 周易玩辭卷十一宋項安世述豐離下震上王假之凡物皆有豐惟王之豐為足以極其至也故曰王假之尚大也孔子曰嚴父莫大於配天孟子曰尊親莫大乎以天下養易曰崇髙莫大乎富貴老氏曰王亦大皆此意也勿憂既豐矣而言勿憂者有大則患失其大無疆惟休則無疆惟恤此古今之至情也漢髙祖之除彭韓繫蕭何疑陳平唐太宗之殺劉洎李君羡皆既豐之後憂之深也聖人曰是不必憂愈憂則愈惑非保大之道也君人者昭吾明德如日之中照臨下土豈有隂慝敢干其間哉如此則不必憂矣雖然日月為髙矣猶有昃食之虞天地為大矣猶有盈虛之變人之智不免於死生鬼神之靈不免於聚散則豐亦豈吾之所能常有就使失之亦常理也又豈憂慮之所能如何哉此聖人極言勿憂之理而因以足卦辭日中之義使知中者人之所當勉而昃亦非人之所能為也冝日中大扺豐卦皆以明為主故下三爻皆自明而無咎上三爻皆暗以能求明為吉不能求為凶此所以冝日中也盈虛消息盈虛者消息之極消息者盈虛之漸消浸亡也息浸長也人乎鬼神乎人者形之盛也鬼神者氣之盛也天地者形氣之大者也一盈一虛猶隨時而消長則形氣之運於其間者從可知矣噬豐賁旅動而明人者為立法既明而後動者為斷刑明以止者為雖明而不敢速止而明者為雖慎而不敢留立法者雷電始作而未至斷刑者雷電至矣聲光並至所以為大折獄用明象電致刑用威象雷六爻豐以雷電皆至成卦故六爻不論敵應皆為相資之象初九九四皆陽也曰配曰夷曰句曰尚古文句即均字皆言同也然雖同無咎但不可過爾同則明動適平過則偏於用明其敝也苛故曰過句災也六二六五皆隂也六二以五為蔀在上而暗也六五以二為章在下而明也二自往五則得疑疾五能來二則有慶譽二之不往非忘君也積誠以感之則其蔀可發而去也故曰有孚發苦吉九三極明可用而上六以柔暗自髙故九三當豐而見沛當晝而見沫有左而右廢皆可小用而不可大用之象其凶皆在上六非九三之咎也故三曰無咎上六曰凶上六居豐之極外極其大而內極其暗自外言之如屋之翬飛上于天際動之至也自內言之九三近在其家乃三歲而不見則不明之至也三歲者上三爻之終也其不明者非九三不與之乃上六柔暗自髙而不下求也故曰自藏又以見九三之無咎也苦不言自藏則人必真以其家為無人而歸責於九三矣配主夷主初以四為配四以初為夷上下異辭也自下並上曰配如妻之配乎夫人帝之配乎天帝也自上並下曰夷如丘之夷而入乎川日之夷而入乎地也旬離納已震納庚自已逆數至庚為旬自離初至震四也過庚復已則為離之四當有焚棄之災故曰過句災也豐其蔀日中見斗六二九四爻辭同用蔀斗而其意之所指則不同六二指六五為蔀為斗故不可往往則入於暗而得疑九四之蔀與斗皆自指也故利於行行則遇明而得吉象恐人誤以二爻同釋亦以四之蔀斗歸責於六五故九四之象最詳曰豐其蔀位不當也言以九居四不得比六二之當位也曰日中見斗幽不明也言九四之幽暗不得比六二之自明也曰遇其夷主吉行也言九四之當仃不得比六二之不往也此二爻以象辭考之然後見其不同大抵二爻之分二中正而明四不中正而又不明也斾昧沛沫蔀者蒙覆之物大則全無所覩斾者旌幡之屬雖大而不全暗斗在昏時之後昧居平旦之前自斾昧言之皆有小明非若蔀斗之甚也斾與昧皆王弼本今從之九家易作沛沫二字大暗謂之沛斗杓後星謂之沫則其昏甚於蔀斗非今義也慶譽六五無應則本無慶也不明則本無譽也其喜與名皆因六二之來而得之爾旅艮下離上卦辭旅小亨旅貞吉凡卦辭重用卦名者别出一義不緣上文也如震來虩虩蓋言自震震驚百里乃震人也頤之貞吉總言一卦之義觀頤自求口實乃觀頤之道也旅小亨就旅之卦才言之可以小亨不可以大用旅貞吉者旅於正則吉不正則凶乃處旅之道也彖柔得中乎外而順乎剛此以六五釋旅小亨之義在外旅也以柔行順小亨也本爻之美止於譽命可見其小矣止而麗乎明此以重卦釋貞吉之義知止則自處者正麗乎明則所依者正旅必如是而後得吉六二以正而無尤初六以不正而取災此可見吉凶之所在矣旅之時義大矣哉旅卦之才可以小亨如六五足矣至旅之時義則甚大非孔孟不足以盡之也聖人懼人但以卦才小旅故贊其時義之大使學者思之至難處者旅之時至難盡者旅之義山上有火山非火之所留也野燒延緣過之而已故名之曰旅而象之以不留獄明象大慎象山不留獄象火之過山斯其所取災旅之所貴乎止者止而麗乎明也初止於下而逺於明復何云哉夫君子之旅以行道也小人之旅以求利也二者皆非明不濟若止於瑣瑣則胥失之矣瑣瑣細小貌也志窮心未快初六柔止於下其志卑汙故曰志窮九四剛炎於上其志髙明不以得利為足故曰心未快此二爻亦冝合觀六二次所居也謂二資所有也謂六童僕所賴也謂三三自外來而比於二旅之相得者也在二為得在三為喪者二以隂得陽故為得三以陽得隂故為喪也童僕貞貞字當自為句不可以連於童僕也旅以貞為吉而六二九三皆得正位故聖人辨之如六居二中正柔順可以合於卦辭之貞貞於此則終無尤也如九居三重剛不中以此為貞適以自危而已九三六五旅自否來三五升降而成卦故二爻當合而觀之九本居五乃捨之而去使變為離火故為焚其次捨二陽之健而下與二隂同止無左右之助故為以旅與下喪其童僕六自三而上至五成離而九去之故為射雉得之而亡其一矢離為雉剛爻為矢言三爻皆剛去其一也一剛去之疑若無譽而終有譽命者雖失一剛而能上及二剛所得多也故曰上逮也旅惡下與而喜上逮中德為譽中位為命外卦為終此即彖所謂柔得中乎外而順乎剛旅之最善者也九四以九居四在旅能順者也雖未得位然就其所處順而麗乎明亦可以得利矣資者本有之財斧者致用之利二止于內故懷資而已四麗乎外故兼得其利然而得利者不若得中得正之為快也君子所樂中正而已利不與焉是以我心不快也其心我心艮六二已得正位而力不能止故曰其心不快其者指其位言之也旅九四力雖可為而未得位故曰我心不快我者指其人言之也其指二字我指九字上六鳥者離之象巢者附麗之至髙者也焚者離火之失性者也笑者喜其髙離之鼓缶而歌也號咷者悲其焚離之大耋之嗟也旅之上即離之三也先號後笑先笑後號旅離在上故後號同人離在下故先號離性炎故多怒也同人之五得二而後成兊故後笑旅之五先已成兊故先笑兊性恱故多喜也喪牛于易大壯九四與六五易位而失其壯很故曰喪羊于易無悔旅上九與六五易位而失其柔順故曰喪牛于易凶六五失其剛故所亡者一矢上九失其柔故所喪者牛六五亡矢而得離之中位故為射雉上九喪牛而得離之上窮故為焚巢五上皆在一卦之終六五為文明之火故終以譽命上九為失性之火故終莫之聞言無譽也巽巽下巽上卦辭姚小彭氏曰巽自遁變六二升而為四以比於五故為小者得亨為利有攸往利見大人也朝公武氏曰兊巽成卦皆主於柔然兊內剛而外柔其用柔也故亨巽內柔而外剛其質柔也故小亨大象申命象風之聲行事象風之迹彖以卦體言之重巽以申命是小亨也事必待於申命而後行豈大亨之規模哉以九五言之剛巽乎中正而志行是利有攸往也以初六六四言之柔皆順乎剛是利見大人也彖辭與旅相類皆總陳卦義而用是以二字結之故知當作三句分説也初六九二巽疑卦也初與二皆以不正自疑史巫主占問之人用史巫紛若者疑之甚也初柔當疑故利以剛矯之二已得中中大於正本自無咎不必紛紛也先儒多以紛若為致吉之道以象辭考之紛若本不應吉紛若之所以吉者以得中也巽自遁變初本在下故其疑淺二本在四忽降而下故其疑深然降而得中與五相配初又順之但見其吉何咎之有升降患不得中既得中矣又何疑焉九三六四九三重剛而不中志本強躁又居下體之終其志極矣迫於二四兩爻之相易不得已而巽故為頻蹙為羞吝六四重柔安於巽者也自二升四失中疑若有悔升而得正是以悔亡不獨悔亡又有成卦之功使遁之上三爻好遁嘉遁肥遁而在田野者皆變而為入此六四之功也故曰田獲三品有功也此小亨之驗巽為利市三倍象亦出此九五巽多疑之卦也九二已中矣猶以不正自疑紛紛而不能決也惟九五中而又正其吉無疑故凡巽之疑悔至是盡亡又曰無不利者決其無疑也又曰無初有終者言初疑而今不疑也言之重辭之復皆為疑設也巽之時惟此爻為美其多疑猶如此可見巽卦無大亨之用也故曰九五之吉位正中也言其吉獨此一位爾九五制命之主故又於爻義之外統論重巽之義庚更也續也事已而更為之以續前事也先事之三日初疑二紛三吝皆未保其吉也後事之三日四有功五無不利始亨其吉也此當於上九言之以上九窮巽而不反别有凶義故於五言之其實後庚三日總言上三爻也上之窮而不反亦以其無下三爻之疑是以不可回爾巽在牀下上九爻辭與九二同皆以陽居隂也當巽之時惟此二爻以陽而失位巽中之又巽者也故皆為巽在牀下言失位也二雖失位而得中中大於正所以吉而無咎上既失位愈巽極而不反故為喪資失斧之人而猶固守其窮凶之道者也以上兩句解下兩句不煩推説而義自明矣凡爻以德為資其本質也以位為斧其利用也上既失位并其剛德而亡之故資斧皆喪也此德宗奉天之後姑息之時也武人資斧巽初六與履六三同稱武人者履之三即互巽之初也巽上九與旅九四同稱資斧者旅之四即互巽之上也巽究為躁故稱武人焉巽為利市三倍故稱資斧焉履之三居下體之終為五陽之主故用其究以為大君巽初未究故利用其究以自治而已旅四得其所處故為得其利巽上無位故其利喪焉兊兊下兊上巽兊巽與兊皆有坎之半體巽不上出所以為入兊不下流所以為澤巽自遁來以六四為主遁變為入故為悔亡兊自大壯來以六三為主壯變為説故為來兊凶兊亨利貞兊之亨利貞自是三德非利在於貞也故曰説以利貞言以利與貞而得説也利者説之情貞者説之理柔在外為利利者萬物之所説也剛在內為貞貞則天人之理得矣順乎天兊上也應乎人兊下也天人皆通所謂亨也彖不言亨者亨者説之效故極言之順天應人革與兊皆言順天應人者順天理之正應人心之公則革無私意説無邪心矣革者天下之大利説者天下之美名此二者最易於失正故革曰元亨利貞兊曰亨利貞蓋謂此也兊自二至上互革民勸矣哉民忘其勞民忘其死即所謂勸也大象朋友以象二兊講以辭説之相會以文也習以身行之相觀以善也六爻兊以六三為主凡諸爻稱兊者皆謂二也初九與之同體為和兊九二與之相比為孚兊六三來而成兊為來兊九四當三五往來之衝為商兊上六與三相應為引兊九五不稱兊而稱剝者卦中獨此一爻與三非同非比非應捨三而去自與上比也隂來比陽為兊陽往比隂為剝其戒深矣陽爻曰和曰孚曰介皆剛辭也隂爻曰來曰引皆柔辭也孚陽為實中實為孚二五皆以陽在中故二為字兊五為孚于剝雖所用不同其孚一也初九九二初二皆與凶人相説而不害為吉者初正而二中也初與三不相比應無可疑者獨以三來同體而與之和和有相濟之義以正濟不正適足救三之凶故小象曰行未疑也九二親與三比始涉可疑然二以剛實在內而得中其志可信決無朋邪之理惟與邪比其悔亦亡故小象曰信志也自二至上為革故悔亡信志初至五為中孚故無疑三至上為大過故凶此又互象之著明者也商兊未寧商兊未寧指三與五也商者交易往來之名三為五而得厲五為三而得凶兩爻相易皆未寧也彼皆商兊而未寧四乃介疾而有喜然則動而求説者未必不為禍靜而受疾者未必不為福也聖人之訓深矣介疾有喜介間也兩者之間人所守以為限别也故物之有兩者謂之介有守者謂之介有别者亦謂之介一在兩中故可謂之介介丘是也一能制兩亦可謂之介大介是也豫之六二能以中正自别不與禍交故為介于石晉之六二守其中正以俟上之明卒受其福故為介福兊以三五兩爻相易成卦九四介於其間守其不正之位而不肯動故為介疾介福者介者之福也介疾者介者之疾也然其疾有喜者五與四本比及降為三復與四比四雖不動而説自隨之也凡疾之愈者為有喜無妄之疾勿藥有喜損其疾使遄有喜皆指疾愈為言也凡隂陽相得者為有慶故象曰九四之喜有慶也明九四之所守本應有疾因隂陽相得故得愈也孚干剝位正當也九五居兊而言剝者以卦氣當之也兊為正秋下二爻七月為否中二爻八月為觀上二爻九月為剝九五當剝之時而説比小人是助剝也故以是戒之象曰位正當也言雖兊爻正當剝位也履夬二卦皆成於乾兊故履之九五稱夬小象辭與此同亦言其在履而當夬位也中孚九五曰有孚攣如即用小畜九五之辭故其象亦曰位正當也言巽體居上四五以正相孚皆與小畜相當也否九五曰大人吉其象亦曰位正當也言此爻正當乾卦九五大人之位也易中小象言位正當也凡四爻皆兼取兩卦相當之義此外得位之爻或稱正或稱當無兼稱者上六萃之六二引吉下為上所引也兊之上六引兊上為下所引也六三為説之主而上六為其所引故曰引兊雖所居得正可以無凶然為下所引而説亦不足觀矣故不稱吉明其未光也渙坎下巽上彖渙亨指九二故曰剛來而不窮王假有廟指九五故曰王乃在中利涉大川指二與四二來成川四來成木故曰乘木有功利貞指四與五彖雖不解利貞二字然上文論成卦之爻其義已見即柔得位乎外而上同也否之六二得位乎四而上同於九五卦中惟四五兩爻為正四為成卦之主五為王位蓋以正臣上合正君而成渙難之利者也故曰利貞石經彖文利涉大川之下亦有利貞二字王假有廟祭祀之禮無物不備則廟中者聚之極也主祭者之心一物不留則廟中者亦渙之極也故萃與渙皆曰王假有廟非知道者不足語此萃之彖曰致孝享以備物言之也渙之彖曰王乃在中以內心言之也觀其彖辭則聖人之意見矣大象天下之至散而不可摶者惟風與水而已二物之相遭天下之言渙者莫加焉先王以是享帝故能與天神接以是立廟故能與祖禰交蓋心無方神亦無方心之遇神當如水之遇風使吾心有一毫之係則不能與神通矣享帝于郊象巽之髙立廟于宫象坎之隱六爻下三爻皆處險而待渙者也初六在否之初急於自拔離而去之則變為無妄而無與於當世之渙故獨不言渙二自四來奔而否始為渙故加渙字自九二始三出險上而有應於外身與險相離矣然未能及人也上三爻皆涉川之木能渙者也四離其類而上同而渙事始成為卦之主故稱元吉五居王位當既渙之後無所復為但當施發散之令以釋天下之疑離事為之煩以享王位之逸而已上乃處渙之極與坎三有應能渙而逺之不罹其害皆乘木有功者也坎為血有傷害之象初六爻辭詳具明夷六二爻中渙奔其機九二本否之九四降而居二而否者於是渙焉自上而降為奔俯而即安為機四本不中降而得中俯而安也故為渙奔其機二志在逃否故渙而去之今乃復在險中疑苦有悔然在險得安猶未失其所願故為悔亡即所謂剛來而不窮也二以震木為機渙其躬自三至五坎散而成艮艮為躬故曰渙其躬三居險之極疑若可悔以與上相應故得連外卦以免其身故曰渙其躬志在外也渙其羣渙有丘六四本否之六二升而為四下離三隂之羣而上為成渙之主巽以出險正以居上渙之最善者也故曰渙其羣元吉然而雖在渙散之中自有丘聚之理非羣隂所知也方渙其羣之時二隂以醜夷之情相望固不免於怨及渙事既成初得吉而三免悔衆隂聚而依焉然後知六四之有功也渙其羣渙之始也渙有丘渙之終也義各不同故兩言渙以别之四在二為坤坤為衆故曰羣四升而上同五為艮艮為山故曰丘渙王居無咎四臣也五君也君不主渙而臣主渙冝苦有咎也然臣道當勞君道當逸臣以有事於險為渙君以無心於事為渙自君言之雖端居不為亦無咎也故曰渙王居無咎正位也渙汗渙之於下使民無事也渙王居渙之於上君無事也凡此皆六四之功所主不同故亦出兩渙字巽之五先庚三日後庚三日故為大號位正中也故為王居為正位王乃在中王居無咎渙離也以廟中言之王乃在中則君心渙然而離於人以朝位言之王居無咎則君職渙然而離於事蓋渙之極致惟此二時為能當之然廟中為尤至故於卦辭言之爻之所主者位故稱居焉渙其血上九爻辭血與出韻叶皆三字成句不以血連去字也小畜之血去惕出與此不同此血已散不假更去又惕與逖文義自殊據小象言逺害也則逖義甚明不容作惕矣卦中惟上九一爻去險最逺故其辭如此汗血散其汗以去泄鬱散其血以逺傷害上三爻皆以巽渙坎者也故汗與血皆指坎言之二居險中為汗汗心液也三居險極為血血外傷也後人因汗字又生出而不反之説非此爻本義也周易玩辭卷十一
