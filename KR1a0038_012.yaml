body:
  text: 周易玩辭卷十二宋項安世述節兊下坎上節艮節者止也艮者止也皆非止之使不進也特謂事理之冝止當如此爾艮之彖曰動靜不失其時其道光明節之象曰不出户庭知通塞也玩此二辭可以知易之所謂止矣渙節否者塞也自否變者為渙泰者通也自泰變者為節此變象之著明者也說以行險險者人之所難說以行之則人不以為苦聖人之制節也如此此其所以通也當位以節中正以通鄭剛中氏曰無位者不能制節制節而不以中正者不能通五既得位又中且正所以能主節也安世按節自泰來泰分九三以為五分六五以為三五獨當位得中得正故節卦以九五為主也大象澤上之所以有水以其得節也過則不留不及則困矣制數度坎之法律也議德行兊之講習也初九九二初在兊下兊為户而主言二為互震震為門而主動兊者闔户之時當其不可言雖户庭之近不可出也震者闢户之時當其可動雖門庭之逺不可以不出也凡事當密而不密與當盡而不盡皆謂之失節初九在一卦之下不與九五相當故其節在於謹密九二與五正對五動而二不動則失時之節矣故曰不出户庭知通塞也不出門庭凶失時極也極猶準則也義與節通此所謂議德行也失時之節遂至於凶者張禹李績謹密不言而覆漢唐之祚凶孰大焉六三六四六三能與九五相易則成節若剛躁自用不受其節則成嗟節與嗟皆自己為之不出於人故曰不節之嗟又誰咎也六四安然不動順受九五之節而得其亨亨自上為之非己所制故曰安節之亨承上道也此所謂制數度也三不為節遂至於嗟者三兊主說說以行險則成節不說則成嗟嗟與說相反者也九五上六九五得中為甘甘者五行之中味也上六窮上為苦苦者炎上之味也節亨指九五也故曰剛柔分而剛得中苦節不可貞指上六也故曰其道窮也九五自泰之三往而得位遂為諸爻之主故曰往有尚上六苦節之極貞而不變以此施於當世其道則凶乃若其心則信正而行不以為苦故曰悔亡古之苦節之士蹈禍敗而不悔者多矣又誰咎也小象又誰咎也凡三同人初九又誰咎也以為褒辭解六三又誰咎也以為貶辭節之六三王弼從解沙隨程迥從同人安世謂三辭皆無褒貶但言人當自謹而己出門同人我所當擇致寇之端我所當省不節之嗟我所當慮得失由己皆無所歸咎也雖與他爻無咎小異然亦得補過之方於本義無悖也觀需九三自我致寇敬慎不敗也則解之自我致戎又誰咎也亦教以自反非必貶辭也中孚兊下巽丄頤中孚大小過坎離者乾坤之用也故上經終於坎離下經終於既未濟頤中孚肖離大小過肖坎故上經以頤大過附坎離下經以中孚小過附既未濟二陽函四隂則謂之頤四陽函二隂則謂之中孚皆美名也二隂函四陽則謂之大過四隂函二陽則謂之小過皆非美名也於是可見貴陽賤隂之意離之為麗坎之為陷意亦類此彖柔在內而剛得中以三四二五之四爻言中也說而巽孚以兩卦之德言孚也豚魚吉以兩卦之象言豚主風魚主澤也乘木舟虛以成卦之象言外實而中虛也利貞應乎天以四五兩爻言四為人五為天皆以正相比也五上皆天爻也故上亦有登天之象應乎天與登乎天不同應者以心感登者以力求也豚魚吉信及豚魚也豚魚天下至隂之物而皆有陽性故二物皆屬坎以其為隂中之陽也中孚直坎之中氣雖窮隂之時而陽在其中故謂之中孚二物皆受其氣而生故得此卦者以養二物則吉二物至微而中氣在焉孚之無所不體如此故曰信及豚魚也巽兊二卦各得坎之半體巽得下體故豚主風氣而喜下入兊得上體故魚為澤物而喜上行豚與雞類性皆主風故巽自坎之豚而為雞魚與羊類目皆不瞑故兊自坎之魚而為羊皆坎之分氣也中孚肖離而氣直豚魚猶小過肖坎而乃為飛鳥之象明坎離之通氣也中孚以利貞中孚以利貞與兊之說以利貞小過之過以利貞利貞皆是二德非謂利在於貞也利者利於事貞者貞於理說而用此是以順乎天而應乎人中孚而用此乃應乎天也過而用此則與時行也匹夫之諒賊生以害理非中孚以利貞也干譽之說害政而違道非說以利貞也陳仲子之過廉離母兄而從妻非過以利貞也大象獄之將決也則議之其既決也則又緩之然後盡於人心故獄成而孚輸而孚在我者盡故在人者無憾也今夫大澤之上雖無事必有風風非自外至也水之積也厚故動而為風中苟有之未有不動者也故聖人以是為中孚之象而君子以其議獄之心體之兊為口舌為附決有議獄之象巽為進退為不果有緩死之象王聽之司寇聽之三公聽之議獄也旬而職聽二旬而職聽三旬而職聽三月而上之緩死也六爻中孚六爻皆不取外應而以比相孚孚在其中無待於外也初九安處於下不假他求而自比於中孚之主靜而自度何吉如之苟變其志動而求孚於四則失其安虞度也燕安也九二鳴於澤中不求人知而三以同體自來相和二有好爵樂與三同此所謂以善養人故中心說而誠服之也此六爻之最美者也二得中位故為好爵靡之猶共之也三內主也四外主也二隂之勢等而三之志剛求四也急故稱敵四之志柔不與三競故稱匹稱類三不正而躁不知自反而求孚於四進退悲喜其狀屢變而四方與五以正相孚如日月之正中而相望自然下亡其匹而絶其類無復顧三之理矣中孚以中正相孚三皆無之是以至此九五所以與四相攣而不可解者以兩爻之位皆正當也若九二六三之相和則但以其中而已故小象於二言中於五言正然五之爻辭不若二之美者二鳴於隂而三應於外其道光明正得中孚之義此中孚之主爻也故繫辭極其義而演之五為大君而內與四比則所孚狹矣特以其皆正故僅得免咎而已上九巽極而躁不正不中以巽雞之翰音而欲效澤鳥之鳴登聞于天內不足而求孚於外聲聞過情其涸也可立而待愈久愈凶何可長也求之於古其商浩房琯之徒歟中心願也中心願也甚言其孚故泰之六四不戒以孚亦曰中心願也得敵六三中本無孚而求孚於人則足以得敵而已謂之得敵則不必更言凶咎也馬匹亡六四稱馬者皆互震也在風之下澤之上澤中遇風正馬亡其匹之地也三變為羊故或很或說四變為雞雞不可連故絶類而上也小過艮下震上亨利貞小過之亨利貞三德也時當小過不稍過則執而不通小過所以通也故曰亨然必於事為利於義為正而後可通苦徒志於隨時以苟通而傷事悖理則非小過之道也故曰利貞自可小事以下彖辭解之自明有飛鳥之象焉亦所以解飛鳥遺之音也音遺於此則飛己過於彼矣石經云是以可小事也彖辭脫可字羡吉字彖象彖曰小過小者過而亨也象曰小過君子以行過乎恭喪過乎哀用過乎儉此二義所主不同蓋論卦之本名則以柔過剛以隂過陽臣過君婦過夫小者而過乎大者其人則小其變則大也故彖辭深寓小大逆順之戒然而天地之間既有小過之象則君子之身亦必有之君子之所謂小過者豈其然哉大德不踰間小德一出焉一入焉亦可以為小過矣如晏子之過儉子臯之過哀正考父之過恭雖過於常理皆小節之過非大變也此與卦義名同而實異凡大象多然以蒙睽明夷考之可見其例曰行曰喪曰用皆見於動以象震也曰恭曰哀曰儉皆當止之節以象艮也山上有雷鳥過人而遺之音以六爻之象言也雷過山而小聞以兩卦之象言也雷震於空曠之地則其聲大又小過寅之初氣也斗方直艮而震氣上出疑於過矣然去卯不逺亦未為大過也初六上六小過以柔過剛義不當吉但二五以柔得中故能於小事粗吉而己初上二爻隂過而不得中是以凶也以卦象觀之二爻皆當鳥翅之末初六在艮之下當止而反飛以飛致凶故曰飛鳥以凶上六居震之極其飛已髙動而成離則麗於網罟故曰飛鳥離之凶初六微賤之人而欲犯上勢不可動方動而已凶故曰不可如何也上六髙貴之人既極而凶如鳥飛不已至於離觸網羅而後見凶故曰已亢也二爻凶同而其事異二五亦當鳥翅而不言飛鳥者惟初上二爻動則成離離為飛鳥故也六二六五六二六五柔之得中者也故皆免於凶然隂過於陽亦無致吉之理二陽君也祖也乃降而居下二隂臣也妣也乃升而居上二本與五為應故往而求之今乃過三與四而見六五焉非所期也故為過祖與君而遇妣與臣之象臣不可言過其君故變文曰不及其君言不相值也其實則過之矣雖然五上自過三四而二在其下未嘗過也故無咎至六五則其過明矣密雲不雨則無陽也自我西郊隂為唱也其事難言故曰己上也言其過上已甚此彖辭所謂上逆也五互兊故為西郊澤在上故為雲公者隂之尊稱六二稱之為臣意亦類此卦體象坎坎為穴二陽在於穴中五自上而臨之故又有公弋取彼在穴之象自隂言之西郊為我故以陽為彼也此爻下而取物則可以有獲上而登天則不能成雨此所謂可小事不可大事不冝上冝下大吉正小過之本義也小過象坎以五為主爻中孚象離以二為主爻故二爻各得本卦之義九三九四九三九四此二爻方為隂所過非能過人者也故皆曰弗過九三在艮之上有防止之義既不能過則當止而防之若恃其重剛而往從之則足以取凶而已將若之何哉從猶從禽從獸謂往逐之魯昭公之於季氏髙貴鄉公之於司馬氏是也九四自知不能過之而與之相遇見危能戒以柔自晦而不敢往足以免凶矣然冠屨易位舛逆己甚柔可暫用不可長守宣帝之於霍氏代宗之於李輔國皆始柔而終剛非永貞也若永貞於柔則為周赧漢獻矣故曰勿用永貞永貞者臣道也九四君也又為動之主豈能鬱鬱久居此乎九四無咎當隂過之時陽不得已能以剛居柔可以無咎矣故九四無咎九三以剛居剛是以凶也剛者本欲攻人反以取禍故九三以從之而受戕柔者屈己相遇若不足以勝人而聖人反勉之以勿用永貞者以其知柔知剛可與有為也六五上六六五雖過其君能與之遇猶未失中則霍光之時也上六一切過之而不與之遇由是天惡其盈而降之災人忿其亢而成其眚此其為凶蓋天人之所同棄非常辭之所謂凶也故於凶之下證之曰是謂災眚此則霍禹霍山之時歟小過大過四陽在內謂之大過而四隂在內者乃不為小過而為頤四隂包二陽謂之小過而四陽包二隂者乃不為大過而為中孚大扺坎陷也故肖坎者皆謂之過陽多則大者過隂多則小者過未至於陷故謂之過過猶輕於陷也頤肖離之牝中孚肖離之中虛皆胎養之事故卦氣皆直北方及純而旺則麗於南方矣既濟離下坎上既濟未濟既濟自泰變六五降而為二以六二為主爻未濟自否變六二升而為五以六五為主爻故二彖皆曰柔得中也既濟之終亂即泰之其命亂也未濟之飲酒即否之後喜也柔為小故既濟曰亨小未濟曰小狐既濟亨小利貞此卦辭與遁相類亨小利貞自為卦之四德但遁卦小字義與利貞相關故彖連下文解之既濟小字義與亨字相關故彖連上文解之此非聖人不能作也六二以柔為卦之主隂為小故稱小焉夫相濟者不必大也小者之才有時而足以濟事又小小通之而其事已濟又為於其小而濟之使不至於甚皆為小者亨也謂小大皆亨者誤也小大皆亨則泰矣何謂濟乎孔穎逹謂當作既濟亨小小者亨也蓋脫一小字初吉終亂彖曰初吉柔得中也則初吉謂六二矣終止則亂其道窮也則終亂謂上六矣二之柔所以濟泰卦之三陽而使之中也故謂之既濟若終止於柔而無剛以濟之則其道又窮而不中矣此其所以復亂也既濟之貴於能濟如此剛柔正而位當也六二之所以為利貞者二五剛柔正應而又當位也剛柔相濟為利當位為貞卦體固有三剛三柔皆正之象然卦辭所主則謂六二若泛言之則失彖義矣思患豫防或以為既濟之後思而防之此乃設戒非觀象也未濟以水下火上為辨物居方正與象合豈於既濟而不然乎天下之患無窮惟有以濟之而後無患人之用莫大於火而火常足以生患善濟火者莫若水思火之為患而儲水以防之使水常在火上其力足以勝之則其患亡矣是故君子制行立教行政舉事必皆有以濟之防末流之生患也周秦之弱師商之過不及皆其事也六爻既濟之六爻初九不急於濟上六道窮而復陷獨二五以中正相感坎離相交是以能濟也二當初濟之時故為用中之主五居己濟之後故安受其福而已三四雖不中而皆不失正用其才皆足以有濟三以剛行之四以柔應之此二者皆既濟之世所與共濟之才也初上以卦時言之二為初上為終以卦象言之初為尾上為首自下上者至首而終則首亦終也六二為濟之闕始而初獨後之馬已行矣而輪尚曳身已濟矣而尾尚濡雖於濟稍遲然無大害故於義為無咎也上六居濟之終而復陷於險如病愈之後而復遇病其能久乎六二既濟之六二本泰之六五帝乙所歸之妹也六五為婦九二為茀柔以剛蔽也今婦降居二而九去居五故為喪其茀然兩爻升降仍在二五未嘗他之故曰勿逐以二交五其數為七故曰七月得象曰以中道也言兩爻雖變而中道未嘗變也茀車之蔽也王弼以為婦人首飾者蓋董遇易茀字作髢弼之所注必本此也三四九三以全剛而濟既歷三爻始能上出亦已憊矣是豈可輕用哉髙宗用之以濟大難而復王室不得已也小人用之好大喜功連兵不解其禍大矣故曰小人勿用言小人占得此爻不可用也六四以全柔而處坎雖已上濟猶終日戒懼者疑二剛也繻子夏傳作𥜗短衣也袽絮緼也夫一𥜗足矣而又有衣焉以表其外有袽焉以實其內可以無慮矣六四處二剛之中五在外為衣三在內為袽其備甚周而猶未免於戒者以柔處險心危慮深不能不有疑於二剛也以泰言之九三本能艱貞而勿恤故有力濟艱難之象六四本與三隂同下故能不戒以孚今乃與二同上安得不疑且戒乎九五既濟本自泰來九五之吉大來即泰之大來吉也泰五互震為東鄰泰二互兊為西鄰五非時主雖有殺牛之富不足以致福五坤為牛坎刑殺之故為殺牛二為卦主得時主祭為禮雖薄而五亦同受其福然則五何必自用哉明泰之五所以降為濟之二也二離為夏夏祭曰禴故為得時五在泰雖尊降而居二自東降而為西自大饗降而為禴祭近於失尊然在既濟之時則當以二為主必降而居二始足以成既濟之功不可以固位而失時故曰不如西鄰之時也未濟坎下離上卦辭既濟未濟皆以柔為主既濟自六二而逹於上六則濟之事已終故為既濟未濟自初六而至於六五幾於濟矣而未能出中以至於上則其事猶未終也故為未濟知此義則未濟之卦辭不待解而自明矣故曰未濟亨柔得中也小狐汔濟未出中也濡其尾無攸利不續終也其曰雖不當位亦指六五言之雖六爻皆不當位義但取五而已曰小曰狐皆隂類也濡其尾即是不能全濟之象險且未濟他又何所利乎故無攸利於無攸利之後復言剛柔應者覆解上文亨字也雖無攸利用其柔中以與剛應自有致亨之理此夫子所以有功於贊易也大象火在上為辨物水在下為居方必加慎字者以其未濟也在濟之時且當思當防況未濟乎水火交則有難未交則未有難然難將生矣辨之不早辨居之不得其所皆難之所由生也可不謹乎易終於未濟而始於屯其意深矣初六九二既濟之諸爻皆濟而初獨未濟故曳輪濡尾之象初得兼之未濟之諸爻皆未濟者也故初為濡尾二為曳輪以兩卦參之則初當為尾九當為輪矣六五升而不能終濟使下有濡尾者此於全體自為可吝非但初六之罪然初六柔暗在下亦非能知終者故以吝責之極即終也不知者智不足也不續者力不竟也九二自否之五降而為二此否之所以成未濟也九二之未濟乃所以亨否其義與初六不同故不為吝而為吉若能貞而守之則未濟者自是濟矣以其位疑於未正故加貞字者中則正在其中未有中而不正者故曰中以行正也姚大老曰協韻正當作直二中而九直故為中以行直其說亦通然正亦協韻後人分一韻為四聲故見其不協耳六三未濟之時方以謀濟為急未可以有行也六三志剛而未得位如人未濟岸而遽欲出行其溺必矣故以征則凶為六三計姑用其剛乘以出坎則事之冝也故曰利涉大川三不當位濟而至四則得其位非利而何未濟九四既濟九三未濟之時所喜在剛三徒以其志之剛猶為利涉況九四乎既濟之九三未濟之九四皆以其剛故能任天下之大役以此見𢎞濟世道非剛不可也九三全剛而位正故直稱髙宗以伐之其言三年克之者以見其役之大小人勿用者以見其才之難苟無九三之才其可以任斯事乎九四則所居者柔比九三為有悔必貞以勝之然後能任其事而無悔故曰貞吉悔亡又加震字亦勉之之辭九四之動為互震也九三出離之上亦為三年至上則飲酒䇿勳故言有賞于大國九三之象曰憊也則以三年言之九四曰志行則以解貞吉悔亡言其志必行而不屈然後得吉而亡悔也髙宗所伐正南鄉之夷今南夷猶稱鬼主國家亦以都鬼主爵之云東北方小夷者非也六五六五雖不當位而與九二剛柔相應同心以濟難者也離雖為光而人君之光非一人之所能獨成乃因與賢臣有孚以致此光故其光也吉而非强明自任之光也故曰君子之光有孚吉象曰君子之光其暉吉也蓋以深辨此意按管輅曰日中為光朝日為暉夫中則日在上朝則日在下在上之光以在下之暉而獲吉則五以二而獲吉明矣先儒謂暉為揮散非也輝者光中之氣詩曰庭燎有輝周禮視祲以十暈為十輝皆謂光中之氣五離中虛故為光二坎中實故為光中之氣也貞吉無悔未濟諸爻皆失正故任事之爻皆曰貞吉九二九四六五是也九二剛中不假言悔六五柔中故言無悔九四不中故曰貞吉悔亡言不如是則悔不亡也貞吉有孚吉六五兩吉字貞吉者六五自謂也有孚吉者謂九二也小象甚明上九之兩有孚亦以三上兩爻言之上九既未濟皆取義於濟故兩卦初上皆稱濡然得失不同者既濟自二始濟則初雖濡尾不害其為既濟也故無咎未濟正坐濡尾不能續終所以為未濟也既濟之終有亂之理故上六以濡首為時事之危未濟之終有濟之理故上九以濡首為人事之失也六五以九二為孚則上九之孚者六三也濟以孚為美然而所以用此孚者不可忽也六三以坎從離酒自下升而入於上則飲酒之象也上九自離入坎首反向下而入於酒則濡首之象也我飲彼則彼可以出險而成既濟之功彼濡我則併我而入於險矣患難將終天下將濟當此之時上之舉動豈可有失失則敗矣此君子所以謹於辨物居方之事也所謂亦不知節者正謂其不明於辨也夫人居患難之久幸其將平方欲相與以樂其終而反因樂以壞其終此何等時而作事如此亦可謂不知節矣聖人繫易至既未濟之終與民同患之意愈切其辭皆懼所謂仁之至智之盡也未濟否未濟非不濟也特未濟爾天地以形言形無可交之理故曰天地不交否水火以氣言氣終於交濟故曰火在水上未濟周易玩辭卷十二
