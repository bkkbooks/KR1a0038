body:
  text: 周易玩辭卷十六宋項安世述序卦上經三十卦易之稱上下經者未有考也以序卦觀之二篇之分斷可知矣屯者盈也屯者物之始生也屯不訓盈也當屯之時剛柔始交天地絪緼雷雨動蕩見其氣之充塞也是以謂之盈爾故謂之盈者其氣也謂之物之始生者其時也謂之難者其事也若屯之訓則紛紜盤錯之義云爾需者飲食之道也需不訓飲食也人之所需飲食為急故以需為飲食之道也需乾下坎上陽為穀實而水氣上蒸亦有釀酒爨食之象焉物畜然後有禮故受之以履履不訓禮也人之所履未有外於禮者外於禮則非所當履故以履為有禮也履上天下澤亦有禮之名分焉朝以道曰王弼略例所引有履者禮也一句但誤以為雜卦爾以喜隨人者必有事蠱者事也蠱不訓事蠱者壞也物壞則萬事生矣事因壞而起故以蠱為事之元如人之亡謂之事故也以喜隨人者必淪胥以壞故雜卦曰豫怠又曰隨無故也怠則不憂無故則無所修飭萬事之壞皆起於怠與隨所謂荒於嬉毁於隨者此之謂也方其隨也自以為無故也孰知多事之端實肇於此乎聖人斷之曰必有事其辭切矣臨者大也豐者大也臨不訓大臨者以上臨下以大臨小凡稱臨者皆大者之事也故以大釋之若豐者大也則豐真訓大矣是以六十四卦之中有二大兩不相妨焉比必有所畜有無妄然後可畜因比而畜以情相畜者也故謂之小畜有無妄而畜以道相畜者也故謂之大畜鄭康成本云有無妄物然後可畜物畜然後有禮物畜然後可養小畜者畜之初有夫婦父子君臣上下禮義方有所錯也大畜者畜之終天地之間物莫不備故養道足此周之禮樂庶事備之時也需者飲食之道也頤者養也需當物生之初如兒之須乳苖之須溉其養之之道微矣故曰飲食之道也頤當物生之極萬物交致其養如天地之養萬物聖人之養萬民如是而後可以謂之養故曰養也不養則不可動震者動也物極則老不可復動如衰老之人得養而後能動動氣雖存本末弱矣此所以為大過也此動字與上文畜字相應畜者止也已止而動者欲滅之明此大過之所以入於坎也若震之動則陽之始出明之始生其力方壯乃可動之時也故先動而後止受之以坎離天地之精氣化生萬物其始也盈滿於天地之間及其終也養之極動之過則復歸於坎離之中月魄下降為坎日魂上升為離故受之以坎離者各還其稟賦之初也此即乾之元亨利而復歸於貞也序不言咸王昭素本云離者麗也麗必有所感故受之以咸咸者感也下經三十四卦上經言天地之生萬物以氣而流形故始於乾坤終於坎離言氣化之本也下經言萬物之相生以形而傅氣故始於咸恆終於既濟言夫婦之道也男女夫婦父子君臣上下禮義男女配合而有夫婦夫婦化生而有父子父子衆則有主有屬故有君臣君臣立則人治詳於是以時刻之相先而定長幼以等級之相臨而分貴賤而上下生矣上下既具則拜趨坐立之節形而宫室車旗之制設其行之必有文是以謂之禮其辨之必有理是以謂之義然則禮義者非能制為人倫也有人倫而後禮義行於其間爾故男女夫婦父子君臣上下皆謂之有而禮義謂之錯明乎此可以知禮義之本矣物不可以終遁故受之以大壯壯與遁相反遁於義為退則大壯似於進矣然而大壯不得為進而雜卦又曰大壯則止何也蓋大壯之義似進而未進似止而非止蓄材待事養鋭積力以止為進者也故序卦不訓謂其難以字訓而可以意曉也孟子曰我善養吾浩然之氣其為氣也至大至剛以直養而無害則塞乎天地之間其大壯之事乎晉者進也漸者進也晉者明出地上進而明也徒進不足以盡之漸者山上有木以漸而進者也漸者進之方而漸亦非進也凡若此類皆取其大意以明卦之序非以卦義為盡於此也蹇難也凡言屯者皆以為難而蹇又稱難者卦皆有坎也然而屯動乎險中則誠行乎患難者也蹇之見險而止則但為其所阻難而不得前爾非患難之難也故居屯者必以經綸濟之而遇蹇者則待其解緩而後前其難易固不侔矣決必有遇決者相分别也遇者相會合也物有分必有合故曰決必有遇姤者遇也陽之長也人以為君子之當然故曰復如人之復常也隂之長也人以為小人之天幸故曰遇如人之遭遇也故彖與雜卦皆曰柔遇剛也小人得君亦其運之遭爾彼豈興行之物哉聚而上者謂之升升主騰上而言徒上不足以擬之故曰聚而上者謂之升如雲之升煙之升魂氣之升皆聚而上者也若象之地中生木爻之升階則但以上為升爾此序卦之所以為有功於發明也物相遇而後聚比必有所畜物相遇而聚者彼此之情交相會也故謂之萃以衆言之也比而有所畜者係而止之也故謂之畜自我言之也畜有止而聚之義聚者不必止也進必有所傷進必有所歸晉之義不止於進乃進而明也明之極必至於無徒故其進也必有所傷漸之義不急於進其進以漸故得其所歸也與人同者物必歸焉故受之以大有得其所歸者必大故受之以豐物皆歸我我奄而有之能有大者也舜禹之有天下是也物得所歸其聚必大能致大者也天下之歸湯武是也此接上文進必有所歸言之也窮大者必失其居秦隋是也入而後説之説而後散之人之情相拒則怒相入則説故入而後説之也憂則氣結説則氣散故説而後散之也節而信之有其信者必行之有其節者必能守之以信自恃其信者其行必果而過於中有其信猶書所謂有其善之有言其以此自負而居有之也大過受以坎小過受以既濟大過則踰越常理甚矣故必至於陷小過則或可以濟事故有濟而無陷也大過訓動小過訓行明過皆經越之義非過失之過矣既濟未濟坎離之交謂之既濟此生生不窮之所從出也而聖人猶以為有窮也又分之以為未濟此即咸感之後繼之以恆久之義也蓋情之交者不可以久而無敝故必以分之正者終之人之心腎其氣何嘗不交而心必在上腎必在下不可易也以此觀之可以知既濟未濟之象矣序卦演義上經始於乾坤自重屯蒙以震艮合坎需訟以坎合乾師比以坎合坤小畜履以巽兊合乾泰否乾坤自合同人大有以離合乾謙豫以震艮合坤隨蠱震艮巽兊自合臨觀以巽兊合坤噬嗑賁以震艮合離無妄大畜以震艮合乾震艮為頤巽兊為大過終之以坎離自重下經咸恆震艮巽兊自合遁大壯以震艮合乾晉明夷以離合坤家人睽以巽兊合離蹇解以震艮合坎損益震艮巽兊自合夬姤以兊巽合乾萃升以兊巽合坤困井以兊巽合坎革鼎以兊巽合離震艮自重漸歸妹震艮巽兊自合豐旅以震艮合離巽兊自重渙節以巽兊合坎巽兊為中孚震艮為小過終之以既未濟坎離自合凡易之序始於乾坤終於坎離而震艮巽兊錯綜於其中故上下經之終皆先列不相反對之卦四而後以坎離終之其不相反對者即震與艮合巽與兊合之卦也明四卦之變畢而後坎離之用終也乾坤相合於上經之內而坎離相合於下經之終明乾坤為體坎離為用也震艮之與巽兊相合於上經者一相合於下經者三乾坤之與坎離相合於上經者三相合於下經者一明乾坤坎離為上經之主震艮巽兊為下經之主也上經無坤合離有乾合坎坤合坎乾合離凡三色下經無乾合坎明下無純陽上無純隂也震艮之合坎離者半在上經屯蒙合坎噬嗑賁合離半在下經而闕巽兊之合坎離者困井渙節合坎家人睽革鼎合離皆在下經明陽多在上隂多在下也巽兊之合坤者一上臨觀一下萃升其合乾者亦一上小畜履一下夬姤而震艮之合坤者二謙豫剝復皆在上經其合乾者亦一上無妄大畜一下遁大壯亦明陽之多在上隂之多在下也坤一得在上者以臨為陽長之卦也乾一在下者以遁為隂長之卦也凡陽長三卦復臨泰皆在上經隂長三卦姤遁否皆在下經否以與泰反對故得在上經也易始於乾坤終於坎離乾坤者形氣之成坎離者精血之運運則雖終而無窮此終始之大義上經首天地下經首夫婦意亦猶此大過小過震艮兊巽之肖坎者也頤中孚震艮兊巽之肖離者也故上下經之終各以二卦附坎離者明震艮兊巽之體亦未嘗外於坎離也雜卦序卦雜卦有序必有雜序者天地之定體雜者天地之大用也有序而無雜則易之用窮矣故以雜卦終之此既濟之後終以未濟之意也易之用無所不通京房揚雄之以卦氣直日其序復與雜卦不同邵康節之以四象畫卦其序復與卦氣不同然則歸藏連山之序必與周易不同無足疑矣然卦氣起中孚先天陽起乾兊隂起巽坎歸藏初坤連山尚艮其説尚可考也獨雜卦則未有知其説者閩人鄭東卿少梅曰上經起乾坤至坎離三十卦下經起咸恆至既未濟三十四卦此序卦所述以為二章也雜卦雖合為一章無上下經之分然自乾坤至困亦三十卦自咸恆至夬亦三十四卦由是推之則其雜之也豈無説而苟然者哉是必有如卦氣先天之説而易師失其傳矣鄭夬易云雜卦解伏羲六十四卦以其始於乾而終於夬也乾剛坤柔乾剛坤柔與離上坎下相類語若淺近而乾坤坎離之性盡於二語之中不可以復加也凡易之剛爻皆乾也凡易之柔爻皆坤也凡繫辭之稱乾坤皆謂剛爻柔爻非但指六畫之兩卦也盡三百八十四爻不過剛柔二字而已比樂師憂比者聖人之本心師者聖人之不能已故比謂之吉師謂之毒師之九二必待中吉而後無咎必待王三錫命而後能成功比之九五內不誡邑人外不取逆者而物自歸之其憂樂之分明矣臨與觀求臨二陽方進我出而與人也觀二陽將去人望而求我也孔孟之周流憂世思濟斯民其臨之義乎反魯居齊人矜式之其觀之義乎屯象屯之初九已出乎震而未離乎下盤桓居貞奠而後動不使有失策也齊威公之次於陘晉文公之表裏山河其慮深矣不可得而危也此髙光之關中河內也蒙之九二藏於坎中不求於蒙而蒙自求之剛中而志應不可得而掩也諸葛孔明王景略之事是也此二卦者皆有康主濟民之用以居對見則見謂出也以著對雜則雜謂隱也屯雖出而不失其處蒙雖處而不免於出二義正相反也艮止也節止也大壯則止雜卦言止者三艮止也大壯則止節止也震一陽起於初艮一陽止於終此天道之起止自東方而至於東北者也大壯之止與遁之退相反謂陽德方盛故止而不退也此止有向進之象非若艮之止而終也節之止與渙之離相反謂遏而止之使不散也此人止之非若大壯之自止也損益損益盛衰之始也此句發明損益之義最為親切泰之變為損損未遽衰也然損而不已自是衰矣否之變為益益未遽盛也然益而不已自是盛矣為人者能使惡日衰善日盛其為聖賢也孰禦哉為國者能使害日衰利日盛其為泰和也孰禦哉大畜無妄以乾之剛而受畜於四五之二隂如大畜者可以言時矣當無妄之時而猶有災焉可以言災矣萃升萃則坤衆在內故聚升則坤衆往外矣故不來精氣聚則為物魂氣上升則散而不來矣謙豫自以為少故謙自以為多故豫少故輕多故怠怠或為怡蓋以怡時災來於韻為協爾然怠字何嘗不協平上去入之分自沈約始贊易時固未分也豫怠二字本是古語噬嗑賁物消曰食色滅曰無噬者合則強物消矣賁者施則真色滅矣故以食與色相對也兊巽屯見而蒙雜皆指陽言之也兊見而巽伏皆指隂言之也坎之隱伏伏於隂中遇陷而不能出也巽之伏伏於陽下順伏之也隨蠱隨以無故而偷安蠱以有故而修飭故聖人不畏多難而畏無難也剝復剝爛盡復反生也凡果爛而仁生物爛而蠱生木葉爛而根生糞壤爛而苖生皆剝復之理也晉明夷進至於日之當天天下之進極矣傷至於體之受誅天下之傷極矣井困以通與遇為反對則遇為相抵而不通之象矣巽之上爻主塞坎水之上流而井之坎乃出其上蓋塞而復通者也故謂之通兊之下爻主塞坎水之下源而困之坎適在其下正遇其塞所以困也自乾坤至此凡三十卦正與上經之數相當咸恆天下之速莫速於感咸速也此語最有味渙節渙節正與井困相反井以木出水故居塞而能通渙則以水浮木故通之極至於散也節以澤上之水故居通而能塞困為澤下之水故塞之極至於困也解蹇解蹇亦皆以水言解近於渙緩而縱之也蹇近於節難而止之也難字説見序卦睽家人睽外家人內皆以離卦言也火在外則氣散火在內則神凝治身治國一也否泰否泰之相反亦在內外之間皆以乾言也乾在外則否乾在內則泰乾者國之君子身之陽氣也大壯遁大壯止遁退亦皆以乾言也乾壯則止而不退乾遁則退而不止也大有同人大有同人皆以離之中爻為主在上則人歸乎我是故謂之衆在下則我同乎人是故謂之親革鼎革以火鎔金故為去故鼎以木鑽火故為取新亦以離為主也小過中孚小過四隂在外而過其常中孚二隂在內而守其常二義正相反對皆主隂言之豐旅卦名皆在句上旅獨在下者取其韻之叶也以多故對寡親則故非事故之故矣凡物之情豐盛則故舊合羈旅則親戚離作易者其知之矣二卦皆主離言之雷與電俱至其黨不亦盛乎山上有火其勢不亦孤乎坎離乾陽而在上坤隂而在下者隂陽之定體如人之首上而腹下也離女而在上坎男而在下者隂陽之精氣互藏其宅如人之心上而腎下也是故腎之精升而為氣則離中之隂也心之精降而為液則坎中之陽也火隂物也而附於陽故炎上水陽物也而藏於隂故就下然則日為隂月為陽乎曰日則陽矣而日中之精則隂之神也月則隂矣而月中之精則陽之神也故曰離上而坎下非知道者不足以識之小畜履小畜與履皆指一隂言之履六三不當位故可暫履而不可久處也小畜六四雖當位而無力故能暫制而不能勝也大有得尊位大中大畜得朋故皆為大而不為寡需訟需訟皆主乾言之止於坎下故不進違坎而去故不親大過頤顛與正皆主陽言之隂陷陽為顛陽養隂為正大過十月卦陽始絶也頤十一月卦陽復生也漸歸妹漸歸妹皆主女而言女子之進也始於待聘終於來歸既得所歸則女道終矣過是而不已則出位而姣惡之大者也故曰歸妹征凶無攸利既濟未濟既濟未濟皆主男而言水能留火故定水不能留火故窮隂陽不交而陽獨受窮者生道屬陽死道屬隂也女終男窮終與窮不同終者事之成女子之義從一而終不可以復進也窮者時之災事窮勢極君子之不幸也姤夬姤夬皆主隂而言隂以遭遇為喜故以附決為憂遇者有喜之辭也自咸恆至此三十四卦正與下經之數相當末章八卦不對説雜卦末章自大過而下八卦皆不對説以為錯簡邪則於韻皆叶以為非錯簡邪則姤夬二卦之辭又若本相對者此其義之不可曉者也虞翻謂大過死象而兩體姤夬故自大過而下次以姤而終於夬言君子之決小人也其説亦有理嘗試因其説而推之大過之象本末俱弱如人之表裏俱絶世之上下俱昏此隂滅陽之時也故為棺椁之象而在雜卦之終聖人作易示天下以無終窮之理教人以撥亂反正之法是故原其亂之始生於姤而極其勢之上窮於夬以示微之當防盛之不足畏自夬而乾有終而復始之義也八卦之序大過者亂之極也亂之原必起於姤姤者小人之初長也漸者小人之窺伺君子也頤者君子遭變而自養也卦氣頤在大雪之後冬至之前既濟者君子之善處小人也三陽三隂各當其位歸妹者小人之遇合也未濟者君子之失位也小人窮其勢必決故受之以夬此一節自大過而下特皆以男女為言至夬而明言之曰君子小人然則聖人之意斷可識矣八卦之象六十四卦為八者八雜卦自乾坤至需訟為八者七矣而末章特餘一八以寓反復無窮之意則是八者必不苟取也蓋嘗考之頤大過者震艮巽兊之正也長男少男長女少女歸妹漸者震兊艮巽之交也長男少女少男長女未濟坎離之正也中男中女既濟坎離之交也中女中男姤坤消乾也夬乾消坤也父母此八卦者正具八純卦之象故聚見於末章以明八卦消長之義也周易玩辭卷十六
